<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8a27a">
<title>史萊姆溫泉度假村</title>
<meta name="description" content="可愛療癒的史萊姆溫泉掛機遊戲，經營你的溫泉度假村！">
<!-- PWA：可安裝到手機桌面、離線遊玩 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="史萊姆溫泉">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6efe4;
    --wood: #c8a27a;
    --wood-dark: #8f6a48;
    --wood-light: #e8d3b8;
    --water: #9fd8e6;
    --water-deep: #6fbfd4;
    --text: #5a4636;
    --soft: #fffaf3;
    --pink: #f7b7c3;
    --green: #9ad9a8;
  }
  * { box-sizing: border-box; }
  button, #pool, .slime {
    touch-action: manipulation;              /* 手機上連點不會觸發雙擊放大 */
    -webkit-tap-highlight-color: transparent;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Zen Maru Gothic", "M PLUS Rounded 1c", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 10%, #fff7ea 0, transparent 40%),
      repeating-linear-gradient(90deg, #f3e8d8 0 40px, #f6efe4 40px 80px);
    overflow: hidden;                 /* 整個遊戲固定在一個畫面裡，不再往下捲 */
    user-select: none;
  }

  /* ===== 遊戲畫面：上方資訊列 + 溫泉池 + 下方分頁列 ===== */
  .game {
    --nav-h: 66px;
    position: relative; margin: 0 auto;
    width: 100%; max-width: 560px;
    height: 100vh; height: 100dvh;   /* dvh：手機網址列縮放時也剛好一個畫面 */
    display: flex; flex-direction: column;
    background: linear-gradient(#efe0c9, #e4cfb0);
    box-shadow: 0 0 0 4px var(--wood-light), 0 0 30px rgba(90,70,54,.25);
  }

  /* 上方資訊列 */
  .hud {
    display: flex; gap: 8px; padding: 10px 10px 8px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }
  .chip {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px;
    background: var(--soft); border: 3px solid var(--wood-light); border-radius: 999px;
    padding: 3px 12px 3px 5px; box-shadow: 0 3px 0 var(--wood-light);
  }
  .chip[hidden] { display: none; }
  .chip .ci {
    width: 32px; height: 32px; flex: none; border-radius: 50%; font-size: 1.1rem;
    display: grid; place-items: center; background: #fff3dc;
  }
  .chip.rb .ci { background: #f3e8ff; }
  .chip.lan .ci { background: #ffe9e4; }
  .chip .cv { min-width: 0; line-height: 1.15; }
  .chip b { display: block; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip small { display: block; font-size: .66rem; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.lan { flex: 0 1 auto; }

  /* 遊戲畫面裡的溫泉池名牌、季節活動 */
  .pool-title {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 460;
    background: linear-gradient(#a9714a, #8f5c3a); color: #fff8ec; font-weight: bold; font-size: .9rem;
    padding: 4px 16px; border-radius: 10px; border: 2px solid #e8c9a0; white-space: nowrap;
    box-shadow: 0 3px 0 #6f4a2e; letter-spacing: .08em; pointer-events: none;
  }
  .season-chip {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%); z-index: 460;
    font-size: .66rem; padding: 2px 10px; border-radius: 999px; white-space: nowrap; pointer-events: none;
    background: rgba(255,244,232,.9); border: 1.5px solid #f0b27a; color: #b8662a;
    max-width: calc(100% - 150px); overflow: hidden; text-overflow: ellipsis;
  }
  .season-chip[hidden] { display: none; }

  /* 左右兩側的圓形按鈕 */
  .side {
    position: absolute; top: 12px; z-index: 650;
    display: flex; flex-direction: column; gap: 10px;
  }
  .side-l { left: 12px; }
  .side-r { right: 12px; }
  .pool-btn { position: relative; }
  .pool-btn .plv {
    position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    font-size: .56rem; font-weight: bold; white-space: nowrap; line-height: 1.4;
    background: var(--soft); border: 1.5px solid var(--wood-light); border-radius: 8px; padding: 0 5px;
  }
  .pool-btn.active { border-color: #e98fa2; box-shadow: 0 4px 0 #c96f83, 0 0 0 3px rgba(233,143,162,.35); }
  .pool-btn.locked { filter: grayscale(.7); opacity: .85; }

  /* 下方分頁列 */
  .nav {
    height: var(--nav-h); flex: none; display: flex; gap: 4px;
    padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    box-sizing: content-box;
    background: linear-gradient(#a9714a, #8a5a38); border-top: 3px solid #e8c9a0;
    position: relative; z-index: 720;
  }
  .nav-btn {
    position: relative; flex: 1 1 0; min-width: 0; cursor: pointer;
    font: inherit; color: #fff8ec; background: rgba(255,255,255,.08);
    border: 2px solid transparent; border-radius: 14px; padding: 4px 2px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .nav-btn i { font-style: normal; font-size: 1.45rem; line-height: 1; }
  .nav-btn span { font-size: .7rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .nav-btn.on { background: var(--soft); color: var(--text); border-color: #e8c9a0; transform: translateY(-6px); box-shadow: 0 4px 0 #6f4a2e; }
  .nav-btn .ndot {
    position: absolute; top: 2px; right: calc(50% - 22px); width: 12px; height: 12px;
    background: #ff7b93; border: 2px solid #fff; border-radius: 50%;
  }
  .nav-btn .ndot[hidden] { display: none; }

  /* 從下方滑出的面板 */
  .sheet {
    position: absolute; left: 0; right: 0; z-index: 710;
    bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px));
    max-height: 62%; display: flex; flex-direction: column;   /* 高度跟著內容，最高 62% */
    background: var(--bg); border: 4px solid var(--wood-light); border-bottom: none;
    border-radius: 26px 26px 0 0; box-shadow: 0 -8px 24px rgba(90,70,54,.25);
    transform: translateY(110%); visibility: hidden;
    transition: transform .3s cubic-bezier(.3,1.2,.5,1), visibility 0s .3s;
  }
  .sheet.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.3,1.2,.5,1); }
  .sheet-head {
    display: flex; align-items: baseline; gap: 10px; padding: 12px 56px 8px 18px;
    border-bottom: 2px dashed var(--wood-light);
  }
  .sheet-head h2 { margin: 0; font-size: 1.05rem; letter-spacing: .08em; }
  .sheet-head small { opacity: .7; font-size: .76rem; }
  .sheet-close {
    position: absolute; top: 8px; right: 10px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    font: inherit; font-size: 1rem; color: var(--text); background: #fff; border: 2px solid var(--wood-light);
    box-shadow: 0 3px 0 var(--wood-light);
  }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 18px; overscroll-behavior: contain; }
  .pane { display: none; }
  .pane.on { display: block; }

  /* ===== 溫泉池 ===== */
  .pool-frame {
    position: relative; flex: 1; min-height: 0; margin: 0 10px 12px;
    background: linear-gradient(var(--wood), var(--wood-dark));
    border-radius: 30px;
    padding: 10px;
    box-shadow: 0 6px 0 #6f5037, 0 10px 20px rgba(90,70,54,.25);
  }
  .pool-frame::before, .pool-frame::after {
    content: ""; position: absolute; width: 38px; height: 38px;
    background: #9b9186; border-radius: 45% 55% 50% 50%;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.12);
  }
  .pool-frame::before { display: none; }   /* 左上角的石頭會壓到資訊列，拿掉 */
  .pool-frame::after { bottom: -8px; right: 40px; width: 50px; height: 32px; }

  #pool {
    position: relative;
    height: 100%;
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.55) 0, transparent 35%),
      radial-gradient(ellipse at 70% 70%, rgba(255,255,255,.3) 0, transparent 30%),
      linear-gradient(180deg, var(--water) 0%, var(--water-deep) 100%);
    transition: transform .08s;
  }
  #pool:active { transform: scale(.99); }

  /* 各溫泉池主題 */
  #pool[data-theme="sakura"] {
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.55) 0, transparent 35%),
      radial-gradient(ellipse at 75% 20%, rgba(255,210,225,.7) 0, transparent 40%),
      linear-gradient(180deg, #bfe6e8 0%, #f3c6d3 100%);
  }
  #pool[data-theme="aurora"] {
    background:
      radial-gradient(ellipse at 70% 80%, rgba(170,230,255,.35) 0, transparent 40%),
      linear-gradient(180deg, #1e2a55 0%, #2f4a7a 45%, #5f9fc0 100%);
  }
  #pool[data-theme="aurora"] .hint { color: #e6f4ff; }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .petal {
    position: absolute; top: -20px; width: 12px; height: 9px;
    background: #ffc4d4; border-radius: 12px 0 12px 0;
    box-shadow: inset -2px -2px 0 rgba(233,143,162,.35);
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(40px, 170px) rotate(200deg); }
    100% { transform: translate(-10px, 360px) rotate(420deg); opacity: .2; }
  }
  .sakura-branch {
    position: absolute; top: -8px; right: -10px; font-size: 54px;
    transform: rotate(200deg); opacity: .9;
  }

  .aurora-band {
    position: absolute; left: -20%; width: 140%; height: 110px; top: 0;
    background: linear-gradient(90deg, transparent, rgba(120,255,200,.45), rgba(140,180,255,.5), rgba(220,150,255,.4), transparent);
    filter: blur(18px); border-radius: 50%;
    animation: auroraWave 9s ease-in-out infinite alternate;
  }
  .aurora-band.b2 { top: 30px; height: 70px; opacity: .7; animation-duration: 13s; animation-delay: -4s; }
  @keyframes auroraWave {
    0%   { transform: translateX(-8%) skewX(-12deg) scaleY(.8); }
    100% { transform: translateX(8%) skewX(12deg) scaleY(1.2); }
  }
  .star {
    position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
    animation: twinkle 1.6s ease-in-out infinite alternate;
  }
  .snow {
    position: absolute; top: -12px; color: #fff; font-size: 12px; opacity: .85;
    animation: snowFall linear infinite;
  }
  @keyframes snowFall {
    to { transform: translate(20px, 350px) rotate(360deg); }
  }
  .ice {
    position: absolute; bottom: -6px; font-size: 34px; opacity: .85;
    filter: drop-shadow(0 0 6px rgba(180,230,255,.9));
  }

  .lock-overlay {
    position: absolute; inset: 10px; border-radius: 22px; z-index: 600;
    background: rgba(255,250,243,.82); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 6px; padding: 16px;
  }
  .lock-overlay[hidden] { display: none; }
  .lock-overlay .big { font-size: 2.6rem; }
  .lock-overlay h3 { margin: 0; letter-spacing: .08em; }
  .lock-overlay p { margin: 0; font-size: .88rem; opacity: .85; }
  .lock-overlay button {
    margin-top: 8px; font: inherit; font-weight: bold; color: #fff; cursor: pointer;
    background: #e98fa2; border: none; border-radius: 16px; padding: 10px 24px;
    box-shadow: 0 4px 0 #c96f83;
  }
  .lock-overlay button:disabled { background: #cbbfb3; box-shadow: 0 4px 0 #a99d91; cursor: not-allowed; }
  .lock-overlay button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #c96f83; }

  /* 圓形按鈕（遊戲畫面左右兩側） */
  .round-btn {
    position: relative;
    width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
    font-size: 1.35rem; line-height: 1; color: var(--text);
    background: radial-gradient(circle at 35% 30%, #fffaf3, #f0dcc2);
    border: 3px solid var(--wood); box-shadow: 0 4px 0 var(--wood-dark), 0 6px 12px rgba(90,70,54,.2);
    display: grid; place-items: center; padding: 0;
    transition: transform .12s, box-shadow .12s;
  }
  .round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
  .round-btn .dot {
    position: absolute; top: -2px; right: -2px; width: 16px; height: 16px;
    background: #ff7b93; border: 2px solid #fff; border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }
  #gear-btn span { display: inline-block; transition: transform .4s; }
  #gear-btn:hover span { transform: rotate(60deg); }

  /* 音樂開關 */
  .music-btn {
    width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
    font-size: 1.35rem; line-height: 1; color: var(--text);
    background: radial-gradient(circle at 35% 30%, #fffaf3, #f0dcc2);
    border: 3px solid var(--wood); box-shadow: 0 4px 0 var(--wood-dark), 0 6px 12px rgba(90,70,54,.2);
    display: grid; place-items: center;
    transition: transform .12s, box-shadow .12s;
  }
  .music-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
  .music-btn .note { display: inline-block; }
  .music-btn.playing .note { animation: noteBob 1.2s ease-in-out infinite; }
  .music-btn.off { filter: grayscale(.7); opacity: .8; }
  .music-btn.off::after { /* 斜線 */
    content: ""; position: absolute; width: 36px; height: 3px; background: #c9803a;
    border-radius: 3px; transform: rotate(-45deg);
  }
  .music-btn.waiting { animation: pulse 1.4s ease-in-out infinite; }
  .music-btn .label {
    position: absolute; top: 2px; right: 58px; white-space: nowrap;
    font-size: .7rem; background: var(--soft); border: 2px solid var(--wood-light);
    border-radius: 10px; padding: 2px 8px; pointer-events: none;
  }
  .music-btn:not(.waiting) .label { display: none; }
  @keyframes noteBob {
    0%,100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-4px) rotate(8deg); }
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 4px 0 var(--wood-dark), 0 0 0 0 rgba(233,143,162,.5); }
    50% { box-shadow: 0 4px 0 var(--wood-dark), 0 0 0 10px rgba(233,143,162,0); }
  }
  .hint {
    position: absolute; bottom: 12px; width: 100%; text-align: center; z-index: 455;
    font-size: .78rem; color: #fff; opacity: .95; pointer-events: none; line-height: 1.5;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .hint b {
    display: inline-block; margin-top: 3px; font-size: .78rem; padding: 2px 12px; border-radius: 999px;
    background: rgba(90,60,40,.35); text-shadow: none;
  }

  /* 蒸氣 */
  .steam {
    position: absolute; bottom: 0; width: 40px; height: 40px;
    background: rgba(255,255,255,.55); border-radius: 50%;
    filter: blur(8px); pointer-events: none;
    animation: steam 5s linear infinite;
  }
  @keyframes steam {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    20% { opacity: .8; }
    100% { transform: translateY(-340px) scale(2.2); opacity: 0; }
  }

  /* 漣漪 & 飄字 */
  .ripple {
    position: absolute; width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8);
    transform: translate(-50%,-50%);
    animation: ripple .7s ease-out forwards; pointer-events: none;
  }
  @keyframes ripple { to { width: 110px; height: 110px; opacity: 0; } }
  .float-txt {
    position: absolute; font-weight: bold; color: #fff8c9;
    text-shadow: 0 2px 0 #d49a3a, 0 0 6px rgba(0,0,0,.15);
    pointer-events: none; transform: translate(-50%,-50%);
    animation: floatUp 1s ease-out forwards; font-size: 1.2rem;
    white-space: nowrap; z-index: 450;
  }
  @keyframes floatUp { to { transform: translate(-50%, -150%); opacity: 0; } }
  .float-txt.crit { font-size: 1.7rem; color: #ffe1ec; text-shadow: 0 2px 0 #e0607e, 0 0 10px rgba(255,120,160,.6); }
  .float-txt.auto { font-size: .9rem; opacity: .9; }

  /* ===== 史萊姆 ===== */
  .slime {
    position: absolute;
    width: 64px; height: 52px;
    transition: left 3s ease-in-out, top 3s ease-in-out;
    cursor: pointer;
  }
  .slime.squish .body { animation: squish .45s ease-out; }
  @keyframes squish {
    0% { transform: scale(1,1); }
    30% { transform: scale(1.25,.7); }
    60% { transform: scale(.9,1.15); }
    100% { transform: scale(1,1); }
  }
  .slime .body {
    position: absolute; inset: 0;
    background: var(--c);
    border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
    box-shadow: inset -6px -8px 0 rgba(0,0,0,.08), inset 6px 6px 0 rgba(255,255,255,.35);
    animation: jiggle 1.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .slime .body::before { /* 高光 */
    content: ""; position: absolute; top: 8px; left: 12px;
    width: 12px; height: 7px; background: rgba(255,255,255,.8);
    border-radius: 50%; transform: rotate(-25deg);
  }
  .slime .eye {
    position: absolute; top: 20px; width: 6px; height: 9px;
    background: #4a3a30; border-radius: 50%;
    animation: blink 4s infinite;
  }
  .slime .eye.l { left: 20px; } .slime .eye.r { right: 20px; }
  .slime .blush {
    position: absolute; top: 30px; width: 10px; height: 5px;
    background: rgba(255,140,160,.6); border-radius: 50%;
  }
  .slime .blush.l { left: 11px; } .slime .blush.r { right: 11px; }
  .slime .mouth {
    position: absolute; top: 29px; left: 50%; width: 8px; height: 4px;
    border: 2px solid #4a3a30; border-top: none; border-radius: 0 0 8px 8px;
    transform: translateX(-50%);
  }
  .slime .towel { /* 頭上小毛巾 */
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(-6deg);
    width: 24px; height: 10px; background: var(--towel, #fff); border-radius: 4px;
    box-shadow: 0 2px 0 #e7ddd0;
  }
  .slime .water-line { /* 泡在水裡的效果 */
    position: absolute; left: -6px; right: -6px; bottom: -4px; height: 18px;
    background: linear-gradient(rgba(159,216,230,.2), rgba(111,191,212,.85));
    border-radius: 50%;
  }
  @keyframes jiggle {
    0%,100% { transform: scale(1,1); }
    50% { transform: scale(1.06,.93); }
  }
  @keyframes blink {
    0%,92%,100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  .bubble {
    position: absolute; bottom: 62px; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff; color: var(--text);
    padding: 5px 10px; border-radius: 14px; white-space: nowrap;
    font-size: .8rem; box-shadow: 0 2px 6px rgba(0,0,0,.1);
    transition: transform .25s cubic-bezier(.3,1.6,.6,1);
    z-index: 5;
  }
  .bubble::after {
    content: ""; position: absolute; bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.show { transform: translateX(-50%) scale(1); }

  /* 小鴨 */
  .duck {
    position: absolute; font-size: 26px; pointer-events: none;
    animation: bob 2.4s ease-in-out infinite;
    transition: left 6s linear;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-5px) rotate(4deg); }
  }

  /* ===== 升級 ===== */
  .shop { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .item {
    display: flex; gap: 12px; align-items: center; text-align: left;
    background: var(--soft);
    border: 3px solid var(--wood-light);
    border-radius: 20px; padding: 12px 14px;
    font: inherit; color: inherit; cursor: pointer;
    box-shadow: 0 4px 0 var(--wood-light);
    transition: transform .1s, box-shadow .1s, opacity .2s;
  }
  @media (hover: hover) {
    .item:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--wood-light); }
  }
  .item:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-light); }
  .item:disabled { opacity: .55; cursor: not-allowed; }
  .item.maxed .cost { color: #7fb3a0; }
  .item .icon {
    font-size: 2rem; width: 52px; height: 52px; flex: none;
    display: grid; place-items: center;
    background: #e6f5f8; border-radius: 16px;
  }
  .item .info { flex: 1; }
  .item .name { font-weight: bold; }
  .item .desc { font-size: .78rem; opacity: .75; margin: 2px 0 4px; }
  .item .cost { font-size: .85rem; color: #c9803a; font-weight: bold; }
  .item .lv {
    font-size: .75rem; background: var(--wood-light); border-radius: 10px;
    padding: 2px 8px; align-self: flex-start;
  }

  .item .cost.rainbow { color: #b77ad6; }

  /* ===== 愛心 ===== */
  .heart {
    position: absolute; pointer-events: none; font-size: 18px; color: #ff8fab;
    animation: heartUp 1.1s ease-out forwards; z-index: 400;
  }
  @keyframes heartUp {
    0% { transform: translate(-50%,0) scale(.4); opacity: 0; }
    20% { opacity: 1; transform: translate(calc(-50% + var(--dx) * .3), -10px) scale(1.1); }
    100% { transform: translate(calc(-50% + var(--dx)), -70px) scale(.8); opacity: 0; }
  }

  /* ===== 稀有史萊姆 ===== */
  .slime.rare { z-index: 300 !important; }
  .slime.rare .body {
    animation: jiggle 1.6s ease-in-out infinite, glow 1.2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 3px rgba(255,240,150,.8)); }
    to   { filter: drop-shadow(0 0 12px rgba(255,230,100,1)); }
  }
  .slime .hat {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%) rotate(-8deg);
    font-size: 24px; line-height: 1; z-index: 2;
  }
  .slime .sparkle {
    position: absolute; font-size: 12px; animation: twinkle 1s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .2; transform: scale(.6); } to { opacity: 1; transform: scale(1.1); } }
  .slime.leaving { opacity: 0; transform: translateY(20px); transition: opacity .8s, transform .8s; }

  .toast {
    position: absolute; top: 76px; left: 50%; transform: translate(-50%, -20px);
    background: #fff8df; max-width: calc(100% - 140px); overflow: hidden; text-overflow: ellipsis; border: 3px solid #f1cf73; color: #9a6b12;
    padding: 6px 16px; border-radius: 16px; font-weight: bold; font-size: .9rem;
    white-space: nowrap; opacity: 0; z-index: 500; pointer-events: none;
    transition: opacity .3s, transform .3s cubic-bezier(.3,1.6,.6,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 圖鑑 ===== */
  .dex-head { display: flex; justify-content: space-between; align-items: baseline; }
  .dex-head small { opacity: .7; }
  .dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .dex-card {
    background: var(--soft); border: 3px solid var(--wood-light); border-radius: 20px;
    padding: 14px 10px 12px; text-align: center; box-shadow: 0 4px 0 var(--wood-light);
  }
  .dex-card .pic {
    position: relative; width: 54px; height: 44px; margin: 14px auto 8px;
    background: var(--c); border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
    box-shadow: inset -5px -6px 0 rgba(0,0,0,.08), inset 5px 5px 0 rgba(255,255,255,.35);
  }
  .dex-card .pic::before, .dex-card .pic::after {
    content: ""; position: absolute; top: 17px; width: 5px; height: 8px;
    background: #4a3a30; border-radius: 50%;
  }
  .dex-card .pic::before { left: 16px; } .dex-card .pic::after { right: 16px; }
  .dex-card .pic span {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: 22px;
  }
  .dex-card.locked .pic { background: #d9cfc3; box-shadow: none; }
  .dex-card.locked .pic::before, .dex-card.locked .pic::after, .dex-card.locked .pic span { display: none; }
  .dex-card .dname { font-weight: bold; font-size: .9rem; }
  .dex-card .rarity { font-size: .72rem; color: #c9803a; }
  .dex-card .count { font-size: .78rem; opacity: .75; margin-top: 4px; }


  /* ===== 彈窗 ===== */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(90,70,54,.35);
    display: grid; place-items: center; z-index: 800; padding: 16px;
  }
  .modal-bg[hidden] { display: none; }
  .modal {
    background: var(--soft); border-radius: 26px; padding: 26px 30px;
    text-align: center; max-width: 340px; width: 100%;
    border: 4px solid var(--wood-light);
    animation: pop .35s cubic-bezier(.3,1.6,.6,1);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .modal .big { font-size: 3rem; }
  .modal h3 { margin: 6px 0; }
  .modal p { margin: 6px 0; font-size: .9rem; }
  .modal .gain { font-size: 1.6rem; font-weight: bold; color: #c9803a; }
  .modal button {
    margin-top: 14px; font: inherit; font-weight: bold;
    background: #7fb3c9; color: #fff; border: none;
    border-radius: 16px; padding: 10px 26px; cursor: pointer;
    box-shadow: 0 4px 0 #5e93a9;
  }
  .modal button:active { transform: translateY(2px); box-shadow: 0 2px 0 #5e93a9; }
  .modal .link-btn {
    background: none; box-shadow: none; color: var(--text); opacity: .6;
    font-weight: normal; font-size: .82rem; padding: 6px 12px; margin-top: 4px; display: block; margin-inline: auto;
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* 每日登入獎勵 */
  .modal.daily { max-width: 400px; }
  .stamps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 12px 0 8px; }
  .stamp {
    background: #f3e8d8; border-radius: 12px; padding: 6px 0 5px; font-size: .68rem;
    border: 2px solid transparent; position: relative;
  }
  .stamp i { display: block; font-style: normal; font-size: 1.2rem; margin-bottom: 2px; }
  .stamp.done { background: #e6f5f8; }
  .stamp.done::after {
    content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 1.6rem; color: #e98fa2; font-weight: bold; background: rgba(255,250,243,.6); border-radius: 10px;
  }
  .stamp.today { border-color: #e98fa2; background: #fff0f3; animation: jiggle 1.4s ease-in-out infinite; }
  .daily .reward-line { font-size: 1.15rem; font-weight: bold; color: #c9803a; margin: 2px 0; }
  .daily .reward-line.rb { color: #b77ad6; }

  /* 設定 */
  .modal.settings { text-align: left; max-width: 400px; }
  .set-row.lang-row { flex-wrap: wrap; }                 /* 語言按鈕放到下一行，文字才不會被擠成好幾行 */
  .set-row.lang-row .mini-btns { width: 100%; }
  .set-row.lang-row .mini-btn { flex: 1; }
  .modal.settings h3 { text-align: center; margin-bottom: 14px; }
  .set-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-bottom: 2px dashed var(--wood-light);
  }
  .set-row:last-of-type { border-bottom: none; }
  .set-row .t b { display: block; }
  .set-row .t small { opacity: .65; font-size: .76rem; }
  /* 音量滑桿 */
  .vol { display: flex; align-items: center; gap: 8px; flex: none; width: 150px; }
  .vol .vol-ico { font-size: 1.1rem; width: 22px; text-align: center; cursor: pointer; }
  .vol .vol-val { font-size: .74rem; width: 34px; text-align: right; opacity: .75; }
  .vol input[type="range"] {
    flex: 1; min-width: 0; height: 26px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .vol input[type="range"]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 10px;
    background: linear-gradient(90deg, #9ad9a8 var(--p, 50%), #e6dccf var(--p, 50%));
  }
  .vol input[type="range"]::-moz-range-track { height: 10px; border-radius: 10px; background: #e6dccf; }
  .vol input[type="range"]::-moz-range-progress { height: 10px; border-radius: 10px; background: #9ad9a8; }
  .vol input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; margin-top: -6px; border-radius: 50%;
    background: #fff; border: 3px solid var(--wood); box-shadow: 0 2px 3px rgba(0,0,0,.2);
  }
  .vol input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 3px solid var(--wood); box-shadow: 0 2px 3px rgba(0,0,0,.2);
  }
  /* 語言切換 */
  .modal .mini-btn.on { border-color: #e98fa2; background: #fff0f3; box-shadow: 0 3px 0 #e98fa2; }
  .modal .danger-btn {
    margin: 0; background: #fff; color: #d0677d; border: 2px solid #f0b3c0;
    box-shadow: 0 3px 0 #f0b3c0; padding: 7px 14px; font-size: .85rem; flex: none;
  }
  .modal .danger-btn.armed { background: #e98fa2; color: #fff; border-color: #d0677d; box-shadow: 0 3px 0 #b85569; }
  .about {
    margin-top: 12px; background: #f3e8d8; border-radius: 16px; padding: 12px 14px;
    font-size: .8rem; line-height: 1.7; text-align: center;
  }
  .about b { font-size: .95rem; }
  .modal.settings .close-btn { display: block; margin: 16px auto 0; }
  /* ===== 點擊粒子 ===== */
  .particle {
    position: absolute; pointer-events: none; z-index: 440; line-height: 1;
    transform: translate(-50%, -50%);
    animation: burst var(--t, .8s) cubic-bezier(.2,.7,.4,1) forwards;
  }
  .particle.bub {
    width: var(--s, 10px); height: var(--s, 10px); border-radius: 50%;
    border: 2px solid rgba(255,255,255,.9); background: rgba(255,255,255,.25);
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(.3) rotate(0); opacity: 1; }
    60%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r, 0deg)); opacity: 0; }
  }

  /* ===== 成就 ===== */
  .ach-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .ach {
    display: flex; gap: 12px; align-items: center;
    background: var(--soft); border: 3px solid var(--wood-light); border-radius: 20px;
    padding: 12px 14px; box-shadow: 0 4px 0 var(--wood-light);
  }
  .ach .medal {
    width: 50px; height: 50px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.6rem;
    background: #eee5da; filter: grayscale(1); opacity: .6;
  }
  .ach.done .medal, .ach.claimed .medal {
    filter: none; opacity: 1;
    background: radial-gradient(circle at 35% 30%, #fff6c9, #f5cf62);
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f1cf73;
  }
  .ach.done { border-color: #f1cf73; animation: achGlow 1.4s ease-in-out infinite alternate; }
  @keyframes achGlow { to { box-shadow: 0 4px 0 #f1cf73, 0 0 14px rgba(241,207,115,.7); } }
  .ach .info { flex: 1; min-width: 0; }
  .ach .aname { font-weight: bold; font-size: .95rem; }
  .ach .adesc { font-size: .76rem; opacity: .75; margin: 2px 0 5px; }
  .ach .bar { height: 8px; background: #eee5da; border-radius: 8px; overflow: hidden; }
  .ach .bar i { display: block; height: 100%; background: linear-gradient(90deg, #9ad9a8, #7fc9b4); border-radius: 8px; }
  .ach .meta { display: flex; justify-content: space-between; font-size: .72rem; margin-top: 4px; opacity: .8; gap: 2px 6px; flex-wrap: wrap; }
  .ach .meta span { white-space: nowrap; }   /* 「0 / 200」不要被拆成兩行，太窄時整段換行 */
  .ach .claim {
    flex: none; font: inherit; font-weight: bold; font-size: .85rem; color: #fff; cursor: pointer;
    background: #e98fa2; border: none; border-radius: 14px; padding: 10px 14px; min-height: 44px;
    box-shadow: 0 3px 0 #c96f83;
  }
  .ach .claim:active { transform: translateY(2px); box-shadow: 0 1px 0 #c96f83; }
  .ach .stamp-ok { flex: none; font-size: .8rem; color: #7fb3a0; font-weight: bold; }

  /* ===== 存檔碼 ===== */
  .mini-btns { display: flex; gap: 6px; flex: none; }
  .modal .mini-btn {
    margin: 0; padding: 7px 12px; font-size: .82rem; min-height: 38px;
    background: #fff; color: var(--text); border: 2px solid var(--wood-light); box-shadow: 0 3px 0 var(--wood-light);
  }
  .save-panel { padding: 4px 0 10px; }
  .save-panel[hidden] { display: none; }
  .save-panel textarea {
    width: 100%; height: 86px; resize: vertical; font: 12px/1.4 ui-monospace, Consolas, monospace;
    border: 2px solid var(--wood-light); border-radius: 12px; padding: 8px; background: #fff; color: var(--text);
    user-select: text; word-break: break-all;
  }
  .save-panel .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .save-panel .msg { font-size: .76rem; opacity: .8; margin: 0; flex: 1; }
  .save-panel .msg.err { color: #d0677d; opacity: 1; }
  .modal .save-panel button { margin: 0; padding: 8px 16px; font-size: .85rem; flex: none; }

  .about .credit {
    margin-top: 8px; padding-top: 8px; border-top: 2px dashed var(--wood-light);
    font-size: .74rem; opacity: .8; line-height: 1.6;
  }

  /* ===== 季節特效 ===== */
  .season-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .season-fx .sp {
    position: absolute; top: -24px; line-height: 1;
    animation: petalFall linear infinite;
  }
  .season-fx .firefly {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: #fff9b0; box-shadow: 0 0 8px 3px rgba(255,245,150,.8);
    animation: firefly 4s ease-in-out infinite alternate;
  }
  @keyframes firefly {
    0%   { transform: translate(0, 0); opacity: .2; }
    50%  { opacity: 1; }
    100% { transform: translate(30px, -25px); opacity: .3; }
  }
  .dex-card { position: relative; }
  .dex-card .limited {
    position: absolute; top: 6px; right: 6px; font-size: .62rem;
    background: #fff4e8; color: #b8662a; border: 1.5px solid #f0b27a;
    border-radius: 8px; padding: 1px 6px;
  }
  .dex-card.off-season { opacity: .55; }

  /* ===== 溫泉祭 ===== */
  .festival {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(135deg, #fff4ec, #fde6e0);
    border: 3px solid #f3c1b3; border-radius: 20px; padding: 14px 16px;
    box-shadow: 0 4px 0 #f3c1b3;
  }
  .fest-lanterns { display: flex; gap: 2px; font-size: 1.6rem; min-width: 60px; }
  .fest-lanterns span { display: inline-block; animation: sway 2.4s ease-in-out infinite; transform-origin: top center; }
  .fest-lanterns span:nth-child(even) { animation-delay: -1.2s; }
  .fest-lanterns .more { font-size: .85rem; align-self: center; animation: none; margin-left: 2px; }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .fest-info { flex: 1; min-width: 200px; font-size: .9rem; }
  .fest-info b { color: #c8553d; }
  .fest-sub { font-size: .76rem; opacity: .75; margin-top: 3px; }
  .fest-btn {
    font: inherit; font-weight: bold; color: #fff; cursor: pointer; min-height: 46px;
    background: linear-gradient(#f08a73, #d9634b); border: none; border-radius: 16px;
    padding: 10px 18px; box-shadow: 0 4px 0 #a94a36;
  }
  .fest-btn:disabled { background: #cbbfb3; box-shadow: 0 4px 0 #a99d91; cursor: not-allowed; }
  .fest-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #a94a36; }
  .fest-overlay {
    position: fixed; inset: 0; z-index: 900; pointer-events: none; overflow: hidden;
  }
  .fest-overlay span {
    position: absolute; bottom: -40px; font-size: 28px;
    animation: lanternRise 4s ease-in forwards;
  }
  @keyframes lanternRise {
    0% { transform: translateY(0) rotate(-5deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(5deg); opacity: .6; }
  }

  /* ===== 史萊姆之家 ===== */
  .section-tip { font-size: .78rem; opacity: .7; margin: 0 0 10px; }
  .house { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .house-card {
    font: inherit; color: inherit; cursor: pointer; text-align: center;
    background: var(--soft); border: 3px solid var(--wood-light); border-radius: 18px;
    padding: 18px 6px 10px; box-shadow: 0 4px 0 var(--wood-light);
    transition: transform .1s, box-shadow .1s;
  }
  .house-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-light); }
  @media (hover: hover) { .house-card:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--wood-light); } }
  .house-card .hname { font-weight: bold; font-size: .85rem; margin-top: 6px; }
  .house-card .hedit { font-size: .7rem; opacity: .6; }

  /* 可重複使用的小史萊姆圖示（史萊姆之家 / 換裝預覽） */
  .mini-slime {
    position: relative; width: 54px; height: 44px; margin: 0 auto;
    background: var(--c); border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
    box-shadow: inset -5px -6px 0 rgba(0,0,0,.08), inset 5px 5px 0 rgba(255,255,255,.35);
  }
  .mini-slime::before, .mini-slime::after {
    content: ""; position: absolute; top: 17px; width: 5px; height: 8px;
    background: #4a3a30; border-radius: 50%;
  }
  .mini-slime::before { left: 16px; } .mini-slime::after { right: 16px; }
  .mini-slime .mtowel {
    position: absolute; top: -5px; left: 50%; transform: translateX(-50%) rotate(-6deg);
    width: 22px; height: 9px; background: var(--towel); border-radius: 4px; box-shadow: 0 2px 0 rgba(0,0,0,.08);
  }
  .mini-slime .mhat {
    position: absolute; top: -21px; left: 50%; transform: translateX(-50%) rotate(-8deg);
    font-size: 21px; line-height: 1;
  }

  /* CSS 畫的聖誕帽（emoji 沒有單獨的聖誕帽） */
  .santa-hat { display: inline-block; position: relative; width: 26px; height: 24px; vertical-align: bottom; }
  .santa-hat::before {
    content: ""; position: absolute; left: 4px; bottom: 5px;
    border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 19px solid #e8505b;
    transform: skewX(-14deg);
  }
  .santa-hat::after {
    content: ""; position: absolute; left: 1px; bottom: 0; width: 24px; height: 7px;
    background: #fff; border-radius: 4px; box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .santa-hat { background: radial-gradient(circle at 88% 8%, #fff 0 3.5px, transparent 4.5px); }

  /* 池中史萊姆的名牌 */
  .slime .tag {
    position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
    font-size: .62rem; white-space: nowrap; padding: 0 6px; border-radius: 8px;
    background: rgba(255,250,243,.8); color: var(--text); pointer-events: none;
  }
  #pool[data-theme="aurora"] .slime .tag { background: rgba(230,244,255,.85); }
  .slime .towel.t-none { display: none; }

  /* ===== 換裝視窗 ===== */
  .modal.dress { max-width: 380px; }
  .dress-preview {
    background: linear-gradient(180deg, var(--water), var(--water-deep)); border-radius: 18px;
    padding: 34px 0 14px; margin-bottom: 12px;
  }
  .dress-preview .mini-slime { transform: scale(1.5); transform-origin: center bottom; }
  .name-field { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; text-align: left; }
  .name-field span { font-weight: bold; font-size: .9rem; flex: none; }
  .name-field input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text);   /* 16px：iOS 不會自動放大 */
    border: 2px solid var(--wood-light); border-radius: 12px; padding: 8px 12px; background: #fff;
  }
  .wardrobe-title { text-align: left; font-weight: bold; font-size: .88rem; margin: 8px 0 6px; }
  .wardrobe-title small { font-weight: normal; opacity: .75; }
  .wardrobe { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
  .modal .ward-item {
    margin: 0; padding: 6px 2px 4px; min-height: 56px; border-radius: 12px;
    background: #fff; color: var(--text); font-weight: normal;
    border: 2px solid var(--wood-light); box-shadow: 0 2px 0 var(--wood-light);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .ward-item .wi { font-size: 1.3rem; line-height: 1; }
  .ward-item .swatch { width: 24px; height: 12px; border-radius: 4px; border: 1px solid rgba(0,0,0,.1); }
  .ward-item small { font-size: .62rem; opacity: .8; }
  .modal .ward-item.equipped { border-color: #e98fa2; background: #fff0f3; box-shadow: 0 2px 0 #e98fa2; }
  .modal .ward-item.locked small { color: #b77ad6; opacity: 1; font-weight: bold; }
  .dress-msg { min-height: 1.2em; font-size: .78rem; margin: 8px 0 0; color: #b77ad6; }

  /* ===== 新手教學 ===== */
  .tut-layer { position: fixed; inset: 0; z-index: 950; }      /* 透明的擋板：教學中不能點到遊戲 */
  .tut-spot {
    position: fixed; border-radius: 20px; pointer-events: none;
    border: 3px solid #fff; box-shadow: 0 0 0 9999px rgba(70,50,38,.58), 0 0 18px rgba(255,255,255,.7);
    /* 不加 transition：畫面捲動時打亮框要緊貼目標，不能落後 */
  }
  .tut-spot.none { display: none; }                          /* 沒有目標的步驟（歡迎畫面）改由整層變暗 */
  .tut-layer.dim { background: rgba(70,50,38,.58); }
  .tut-card {
    position: fixed; width: min(340px, calc(100vw - 32px));
    background: var(--soft); border: 4px solid var(--wood-light); border-radius: 22px;
    padding: 16px 18px 14px; text-align: center; box-shadow: 0 8px 24px rgba(60,40,30,.3);
    animation: pop .3s cubic-bezier(.3,1.6,.6,1);
  }
  .tut-card .tut-slime { font-size: 2rem; line-height: 1; }
  .tut-card h3 { margin: 6px 0 4px; font-size: 1.05rem; }
  .tut-card p { margin: 0; font-size: .86rem; line-height: 1.6; }
  .tut-card .tut-langs { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .tut-card .tut-langs button {
    font: inherit; font-size: .82rem; cursor: pointer; color: var(--text); padding: 6px 12px; border-radius: 12px;
    background: #fff; border: 2px solid var(--wood-light); box-shadow: 0 3px 0 var(--wood-light);
  }
  .tut-card .tut-langs button.on { border-color: #e98fa2; background: #fff0f3; box-shadow: 0 3px 0 #e98fa2; }
  .tut-card .tut-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 8px; }
  .tut-card .tut-step { font-size: .75rem; opacity: .6; }
  .tut-card .tut-skip {
    font: inherit; font-size: .8rem; background: none; border: none; color: var(--text); opacity: .6; cursor: pointer; padding: 8px;
  }
  .tut-card .tut-next {
    font: inherit; font-weight: bold; color: #fff; cursor: pointer; min-height: 42px;
    background: #7fb3c9; border: none; border-radius: 14px; padding: 8px 20px; box-shadow: 0 4px 0 #5e93a9;
  }
  .tut-card .tut-next:active { transform: translateY(2px); box-shadow: 0 2px 0 #5e93a9; }

  /* ===== 手機版 ===== */
  @media (max-width: 640px) {
    .game { box-shadow: none; }
    .modal { padding: 20px 18px; border-radius: 22px; }
    .stamps { gap: 3px; }
    .stamp { font-size: .6rem; border-radius: 9px; }
    .stamp i { font-size: 1rem; }
    .set-row { flex-wrap: wrap; }
    .festival { padding: 12px; gap: 10px; }
    .fest-info { min-width: 0; flex-basis: calc(100% - 80px); }
    .fest-btn { width: 100%; }
  }
  @media (max-width: 360px) {
    .round-btn, .music-btn { width: 44px; height: 44px; font-size: 1.15rem; }
    .chip { padding-right: 8px; }
    .chip b { font-size: .95rem; }
    .nav-btn span { font-size: .62rem; }
  }
  /* 很矮的畫面（手機橫放）：面板拉高一點 */
  @media (max-height: 560px) {
    .sheet { max-height: 78%; }
  }
