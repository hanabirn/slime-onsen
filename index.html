      'season.xmas.label': '🎄 クリスマス限定：サンタ帽スライム出没中！', 'season.xmas.when': 'クリスマス（12/1〜12/25）',
    },
  };
  const LANGS = [['zh', '中文'], ['en', 'English'], ['ja', '日本語']];
  const HTML_LANG = { zh: 'zh-Hant', en: 'en', ja: 'ja' };
  const DATE_LOCALE = { zh: 'zh-TW', en: 'en-US', ja: 'ja-JP' };
  const LANG_KEY = 'slimeOnsenLang';
  // 第一次玩：依瀏覽器語言決定（日文 → 日本語、中文 → 中文、其他 → English）
  function detectLang() {
    try { const v = localStorage.getItem(LANG_KEY); if (I18N[v]) return v; } catch (e) {}
    const nav = (navigator.language || '').toLowerCase();
    return nav.startsWith('ja') ? 'ja' : nav.startsWith('zh') ? 'zh' : 'en';
  }
  let lang = detectLang();
  function t(key, params) {
    let s = I18N[lang][key];
    if (s === undefined) s = I18N.zh[key];
    if (s === undefined) return key;
    if (!params || typeof s !== 'string') return s;
    return s.replace(/\{(\w+)\}/g, (m, k) => params[k] !== undefined ? params[k] : m);
  }

  // ===== 溫泉池設定 =====
  // 數值平衡：解鎖價格 ≈ 基礎產出 × 250~500 秒，擴建每 +1/秒 的起始價格約 15~120 幣，
  // 所以舊池擴建變貴時，解鎖新池就是更划算的選擇。
  const POOLS = [
    { id: 'forest', icon: '🌲', unlock: 0,
      base: 1,   perLv: 1,   clickBase: 1,  clickPerLv: 0.5, lvCost: 15,
      colors: ['#a8e6b8', '#f7b7c3', '#b8d4f7', '#f9dc8c', '#d4bdf5', '#ffc9a3'],
      towel: '#fff' },
    { id: 'sakura', icon: '🌸', unlock: 5000,
      base: 20,  perLv: 8,   clickBase: 5,  clickPerLv: 4,   lvCost: 800,
      colors: ['#ffc4d4', '#ffe0e9', '#f5b0c8', '#fff0c9', '#e8c8f0', '#ffd7c2'],
      towel: '#ffd6e0' },
    { id: 'aurora', icon: '❄️', unlock: 150000,
      base: 300, perLv: 100, clickBase: 60, clickPerLv: 50,  lvCost: 12000,
      colors: ['#c8ecff', '#e3f6ff', '#b9d3ff', '#d9ccff', '#bff5ea', '#f0f4ff'],
      towel: '#dff3ff' },
  ];
  // 把資料表裡的名稱等文字改成「依目前語言讀取」的屬性，例如 POOLS[0].name
  function localize(list, props) {
    for (const o of list) for (const [prop, key] of Object.entries(props)) {
      Object.defineProperty(o, prop, { get: () => t(key(o)), enumerable: true });
    }
  }
  localize(POOLS, { name: p => `pool.${p.id}.name`, lines: p => `pool.${p.id}.lines` });
  const poolDef = id => POOLS.find(p => p.id === id);

  // ===== 遊戲狀態 =====
  const freshState = () => ({
    coins: 0, rainbow: 0,
    ducks: 0, snackLv: 0, chairLv: 0,
    helperLv: 0, milkLv: 0, bambooLv: 0, lureLv: 0,   // v2.2 新升級：打掃小幫手 / 牛奶販賣機 / 源泉竹筒 / 招客大燈籠
    pools: Object.fromEntries(POOLS.map(p => [p.id, { unlocked: p.unlock === 0, lv: 0 }])),
    activePool: 'forest',
    dex: {},               // 稀有史萊姆 id → 捕獲次數
    daily: { last: null, streak: 0 },   // 上次領取每日獎勵的日期（YYYY-MM-DD）與連續天數
    stats: { clicks: 0, pets: 0, totalEarned: 0 },   // 成就用：撈取次數、摸摸次數、累計賺得溫泉幣（溫泉祭不重置）
    ach: {},                            // 成就 id → 'done'（可領取）或 'claimed'（已領取）
    lanterns: 0, festivals: 0,          // 溫泉祭：祭典燈籠數量、舉辦次數（轉生後保留）
    runEarned: 0,                       // 這一輪（上次溫泉祭之後）累計賺到的溫泉幣
    looks: {},                          // 史萊姆外觀：'池id-編號' → { name?, hat, towel }（name 只存玩家自己取的名字）
    wardrobe: { hats: [], towels: [] }, // 已購買的帽子 / 毛巾
    tutorial: false,                    // 是否看完新手教學
    startedAt: Date.now(),
    lastSeen: Date.now(),
  });
  let state = freshState();

  // 所有溫泉幣收入都走這裡，溫泉祭才能計算本輪賺了多少
  function earn(n) {
    state.coins += n;
    state.runEarned += n;
    state.stats.totalEarned += n;
  }

  const active = () => poolDef(state.activePool);
  const activeData = () => state.pools[state.activePool];

  const cost = {
    pool:  () => Math.floor(active().lvCost * Math.pow(1.15, activeData().lv)),
    duck:  () => Math.floor(100 * Math.pow(1.8, state.ducks)),
    snack: () => Math.floor(500 * Math.pow(1.5, state.snackLv)),
    chair: () => Math.floor(5 * Math.pow(1.6, state.chairLv)),   // 以彩虹金幣計價
    helper: () => Math.floor(1000 * Math.pow(1.7, state.helperLv)),
    milk:   () => Math.floor(2000 * Math.pow(1.9, state.milkLv)),
    lure:   () => Math.floor(3000 * Math.pow(2, state.lureLv)),
    bamboo: () => Math.floor(10 * Math.pow(1.5, state.bambooLv)),  // 以彩虹金幣計價
  };
  // 有上限的升級
  const MAX_LV = { milk: 10, bamboo: 16, lure: 8 };
  const critChance = () => state.milkLv * 0.03;                    // 牛奶：每級 +3% 暴擊機率，暴擊 ×10
  const CRIT_MULT = 10;
  const offlineCapSec = () => (8 + state.bambooLv) * 3600;         // 竹筒：每級離線上限 +1 小時
  const lanternMult = () => 1 + state.lanterns * 0.1;              // 每個祭典燈籠 +10% 所有收益
  const multiplier = () => (1 + state.ducks * 0.25) * lanternMult();
  const poolPerSecond = p => state.pools[p.id].unlocked ? (p.base + p.perLv * state.pools[p.id].lv) * multiplier() : 0;
  const perClick   = () => POOLS.reduce((sum, p) => {
    const d = state.pools[p.id];
    return d.unlocked ? sum + p.clickBase + p.clickPerLv * d.lv : sum;
  }, 0) * (1 + state.chairLv) * multiplier();
  // 打掃小幫手：每級每秒自動撈 1 次（不會暴擊），算進每秒產出，所以離線也會幫忙
  const autoPerSecond = () => perClick() * state.helperLv;
  const perSecond  = () => POOLS.reduce((sum, p) => sum + poolPerSecond(p), 0) + autoPerSecond();
  const rainbowPerSecond = () => state.snackLv * 0.1;

  // ===== 儲存 / 讀取 =====
  let hiddenSince = null;  // 分頁被切走的時間點；切走期間不更新 lastSeen，才能補發收益
  function save() {
    state.lastSeen = hiddenSince ?? Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  // 把存檔資料（localStorage 或匯入的存檔碼）補齊成目前版本的格式
  function normalize(data) {
    const base = freshState();
    const s = { ...base, ...data };
    s.dex = s.dex || {};
    s.ach = s.ach || {};
    s.daily = { ...base.daily, ...data.daily };
    s.stats = { ...base.stats, ...data.stats };
    s.looks = s.looks || {};
    s.wardrobe = { hats: [], towels: [], ...data.wardrobe };
    if (data.runEarned == null) s.runEarned = s.coins || 0;          // 舊存檔：以目前金幣當作本輪收入
    if (!data.stats || data.stats.totalEarned == null) s.stats.totalEarned = s.runEarned;  // 舊存檔：至少有本輪收入
    if (data.tutorial == null) s.tutorial = true;                    // 舊玩家不用再看新手教學
    // 舊版會把預設名字（例如「小綠」）也存進去；拿掉後切換語言時才會顯示該語言的預設名字
    for (const [key, look] of Object.entries(s.looks)) {
      const [pid, idx] = key.split('-');
      if (look && look.name === (I18N.zh['names.' + pid] || [])[idx]) delete look.name;
    }
    if (!data.startedAt) s.startedAt = data.lastSeen || Date.now();
    s.pools = base.pools;
    for (const p of POOLS) Object.assign(s.pools[p.id], (data.pools || {})[p.id]);
    if (!data.pools && data.poolLv) s.pools.forest.lv = data.poolLv;  // 舊版存檔轉換
    delete s.poolLv;
    if (!poolDef(s.activePool) || !s.pools[s.activePool]) s.activePool = 'forest';
    return s;
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) {}
    return null;
  }

  // ===== 數字格式 =====
  function fmt(n) {
    if (n < 1000) return (Math.round(n * 10) / 10).toLocaleString();
    const units = ['', 'K', 'M', 'B', 'T'];
    let i = 0;
    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
    return n.toFixed(n < 10 ? 2 : 1) + units[i];
  }
  function fmtTime(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
    if (h) return t('time.hm', { h, m });
    if (m) return t('time.ms', { m, s });
    return t('time.s', { s });
  }

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const pool = $('pool');

  // 有上限的升級：滿級時顯示 MAX 並停用
  function renderUpgrade(kind, field, cur) {
    const lv = state[field], maxed = lv >= (MAX_LV[kind] || Infinity);
    $('cost-' + kind).textContent = maxed ? 'MAX' : fmt(cost[kind]());
    $('lv-' + kind).textContent = lv;
    $('buy-' + kind).classList.toggle('maxed', maxed);
    $('buy-' + kind).disabled = maxed || state[cur] < cost[kind]();
  }

  function render() {
    // 上方資訊列與溫泉池底部的產量
    $('coins').textContent = fmt(state.coins);
    $('cps-label').textContent = t('hud.perSec', { n: fmt(perSecond()) });
    $('rainbow').textContent = fmt(state.rainbow);
    $('rps-label').textContent = t('hud.perSec', { n: fmt(rainbowPerSecond()) });
    $('pool-stats').textContent = t('pool.stats', { ps: fmt(perSecond()), pc: fmt(perClick()) });
    const def = active(), data = activeData();
    $('pool-icon').textContent = def.icon;
    $('pool-upg-name').textContent = t('upg.pool', { pool: def.name });
    $('pool-upg-desc').textContent = data.unlocked
      ? t('upg.poolDesc', { ps: fmt(def.perLv * multiplier()), pc: fmt(def.clickPerLv) })
      : t('upg.locked');
    $('cost-pool').textContent = fmt(cost.pool());
    $('cost-duck').textContent = fmt(cost.duck());
    $('lv-pool').textContent = data.lv;
    $('lv-duck').textContent = state.ducks;
    $('buy-pool').disabled = !data.unlocked || state.coins < cost.pool();

    for (const p of POOLS) {
      const d = state.pools[p.id];
      $('tabinfo-' + p.id).textContent = d.unlocked ? 'Lv.' + d.lv : '🔒';
      $('tab-' + p.id).classList.toggle('locked', !d.unlocked);
    }
    if (!data.unlocked) {
      $('unlock-btn').textContent = t('unlock.btn', { n: fmt(def.unlock) });
      $('unlock-btn').disabled = state.coins < def.unlock;
    }
    $('buy-duck').disabled = state.coins < cost.duck();

    $('cost-snack').textContent = fmt(cost.snack());
    $('cost-chair').textContent = fmt(cost.chair());
    $('lv-snack').textContent = state.snackLv;
    $('lv-chair').textContent = state.chairLv;
    $('buy-snack').disabled = state.coins < cost.snack();
    $('buy-chair').disabled = state.rainbow < cost.chair();
    renderUpgrade('helper', 'helperLv', 'coins');
    renderUpgrade('milk', 'milkLv', 'coins');
    renderUpgrade('lure', 'lureLv', 'coins');
    renderUpgrade('bamboo', 'bambooLv', 'rainbow');
    renderFestival();

    // 下方分頁列的紅點：有買得起的升級 / 有成就可以領 / 可以舉辦溫泉祭
    setNavDot('shop', [...document.querySelectorAll('.shop .item')].some(b => !b.disabled));
    setNavDot('ach', ACHIEVEMENTS.some(a => state.ach[a.id] === 'done'));
    setNavDot('fest', festGain() >= 1);
  }
  function setNavDot(pane, on) {
    const dot = document.querySelector(`.nav-btn[data-pane="${pane}"] .ndot`);
    if (dot.hidden === on) dot.hidden = !on;
  }

  // ===== 溫泉祭（轉生系統）=====
  // 本輪賺得的溫泉幣越多，能換到的祭典燈籠越多；用平方根讓後期不會暴增。
  // 5 萬 → 1 個、20 萬 → 2 個、125 萬 → 5 個、500 萬 → 10 個
  const FEST_UNIT = 50000;
  const lanternsFor = earned => Math.floor(Math.sqrt(earned / FEST_UNIT));
  const festGain = () => lanternsFor(state.runEarned);

  let lanternShown = -1;
  function renderFestival() {
    const gain = festGain();
    if (lanternShown !== state.lanterns) {
      lanternShown = state.lanterns;
      const n = state.lanterns;
      $('fest-lanterns').innerHTML = n
        ? '<span>🏮</span>'.repeat(Math.min(n, 5)) + (n > 5 ? `<span class="more">×${n}</span>` : '')
        : '<span style="opacity:.35">🏮</span>';
      $('lantern-chip').hidden = !n;
      $('lantern-count').textContent = n;
      $('lantern-bonus').textContent = t('hud.bonus', { p: n * 10 });
      $('fest-line1').innerHTML = t('fest.owned', { n, p: n * 10 });
    }
    $('fest-line2').innerHTML = t('fest.earned', { e: fmt(state.runEarned), g: gain });
    $('fest-next').textContent = t('fest.next', { n: fmt((gain + 1) ** 2 * FEST_UNIT - state.runEarned) });
    $('fest-btn').disabled = gain < 1;
  }

  $('fest-btn').addEventListener('click', () => {
    const gain = festGain();
    if (gain < 1) return;
    sfx.tick();
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div class="big">🏮🎆🏮</div>
        <h3>${t('fest.confirmTitle')}</h3>
        <p>${t('fest.confirmText')}</p>
        <div class="gain" style="color:#c8553d">${t('fest.gain', { n: gain })}</div>
        <p>${t('fest.incomeChange', { a: state.lanterns * 10, b: (state.lanterns + gain) * 10 })}</p>
        <p style="font-size:.78rem;opacity:.75;text-align:left;margin-top:10px">
          ${t('fest.resets')}<br>
          ${t('fest.keeps')}
        </p>
        <button data-sfx="own" class="fest-go" style="background:#d9634b;box-shadow:0 4px 0 #a94a36">${t('fest.go')}</button>
        <button class="link-btn fest-cancel">${t('fest.cancel')}</button>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelector('.fest-cancel').onclick = () => bg.remove();
    bg.querySelector('.fest-go').onclick = () => { bg.remove(); holdFestival(); };
  });

  function holdFestival() {
    const gain = festGain();
    if (gain < 1) return;
    const base = freshState();
    state.lanterns += gain;
    state.festivals += 1;
    // 只重置「本輪」的經營進度，其餘收藏類資料全部保留
    Object.assign(state, {
      coins: 0, rainbow: 0, ducks: 0, snackLv: 0, chairLv: 0,
      helperLv: 0, milkLv: 0, bambooLv: 0, lureLv: 0,
      pools: base.pools, activePool: 'forest', runEarned: 0,
    });
    refreshAll();
    sfx.sparkle();
    setTimeout(() => sfx.sparkle(), 350);
    toast(t('fest.toast', { n: state.festivals, p: state.lanterns * 10 }));

    // 天燈升空動畫
    const layer = document.createElement('div');
    layer.className = 'fest-overlay';
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.textContent = '🏮';
      s.style.left = (Math.random() * 95) + '%';
      s.style.animationDelay = (Math.random() * 1.5) + 's';
      s.style.fontSize = (22 + Math.random() * 16) + 'px';
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 6000);
  }

  // ===== 音效（Web Audio API 即時合成，不需要音效檔）=====
  // 音量 0～100，存在 localStorage（不放進存檔碼，換裝置時各自設定）
  const SFX_KEY = 'slimeOnsenSfx';          // 舊版的音效開關（'off' = 關）
  const SFX_VOL_KEY = 'slimeOnsenSfxVol';
  const MUSIC_VOL_KEY = 'slimeOnsenMusicVol';
  function loadVol(key, def) {
    try {
      const v = localStorage.getItem(key);
      if (v !== null && v !== '' && !isNaN(v)) return Math.max(0, Math.min(100, Number(v)));
    } catch (e) {}
    return def;
  }
  let sfxVol = loadVol(SFX_VOL_KEY, 80);
  try { if (localStorage.getItem(SFX_VOL_KEY) === null && localStorage.getItem(SFX_KEY) === 'off') sfxVol = 0; } catch (e) {}
  let sfxOn = sfxVol > 0;
  let musicVol = loadVol(MUSIC_VOL_KEY, 50);
  const bgmVolume = () => musicVol / 100 * 0.7;   // 音量 50 = 原本的 0.35
  let audioCtx = null;

  function getCtx() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // 播放一個短音：頻率可滑動，音量快速淡出，聽起來就是「啵」「叮」
  function tone(freq, { type = 'sine', dur = 0.12, vol = 0.2, slideTo = null, delay = 0 } = {}) {
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(Math.max(0.0002, vol * sfxVol / 80), t + 0.01);   // 音量 80 = 原本的大小
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  const sfx = {
    // 撈溫泉：水泡「啵」，音高隨機一點點比較自然
    pop()  { if (!sfxOn) return; const f = 480 + Math.random() * 180; tone(f, { slideTo: f * 1.9, dur: 0.09, vol: 0.2 }); },
    // 一般按鈕：輕巧的「嗒」
    tick() { if (!sfxOn) return; tone(900, { type: 'triangle', slideTo: 1300, dur: 0.06, vol: 0.1 }); },
    // 購買升級：清脆的「叮～」
    ding() {
      if (!sfxOn) return;
      tone(1046, { type: 'triangle', dur: 0.35, vol: 0.14 });
      tone(1568, { dur: 0.45, vol: 0.08, delay: 0.06 });
    },
    // 摸史萊姆：Q彈的「啵嚶」
    boing() { if (!sfxOn) return; tone(260, { slideTo: 620, dur: 0.18, vol: 0.18 }); },
    // 稀有史萊姆 / 解鎖 / 每日獎勵：閃亮的琶音
    sparkle() {
      if (!sfxOn) return;
      [784, 988, 1175, 1568].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.3, vol: 0.11, delay: i * 0.07 }));
    },
  };

  // 所有按鈕預設發出「嗒」；有自己專屬音效的按鈕標上 data-sfx="own"
  document.querySelectorAll('.item, #unlock-btn').forEach(b => b.dataset.sfx = 'own');
  document.addEventListener('click', e => {
    const btn = e.target.closest && e.target.closest('button');
    if (btn && btn.dataset.sfx !== 'own') sfx.tick();
  }, true);

  // 在池中 (x, y) 顯示飄字
  function floatText(x, y, text, cls) {
    const ft = document.createElement('div');
    ft.className = 'float-txt' + (cls ? ' ' + cls : ''); ft.textContent = text;
    ft.style.left = x + 'px'; ft.style.top = y + 'px';
    pool.appendChild(ft);
    setTimeout(() => ft.remove(), 1000);
  }

  // ===== 點擊撈金幣 =====
  pool.addEventListener('click', e => {
    const r = pool.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const crit = Math.random() < critChance();
    const gain = perClick() * (crit ? CRIT_MULT : 1);
    earn(gain);
    state.stats.clicks++;
    if (crit) sfx.ding(); else sfx.pop();

    const rp = document.createElement('div');
    rp.className = 'ripple'; rp.style.left = x + 'px'; rp.style.top = y + 'px';
    pool.appendChild(rp);
    setTimeout(() => rp.remove(), 700);
    floatText(x, y, (crit ? t('crit') + ' +' : '+') + fmt(gain), crit ? 'crit' : '');
    spawnParticles(x, y);
    render();
    checkAchievements();
  });

  // ===== 點擊粒子（依溫泉池主題換風格）=====
  const PARTICLE_SETS = {
    forest: [['♥', '#ff8fab'], ['✦', '#ffe07a'], ['bub'], ['bub'], ['♡', '#ffb3c6']],
    sakura: [['♥', '#ff8fab'], ['✿', '#ffc4d4'], ['❀', '#f7a8c0'], ['✦', '#fff2a8'], ['bub']],
    aurora: [['❄', '#e6f7ff'], ['✦', '#9ff5e0'], ['✧', '#c9b8ff'], ['♥', '#ffc2d6'], ['bub']],
  };
  let particleCount = 0;
  function spawnParticles(x, y) {
    const set = PARTICLE_SETS[state.activePool] || PARTICLE_SETS.forest;
    const n = particleCount > 50 ? 3 : 7;          // 狂點時自動減量，手機也不會卡
    for (let i = 0; i < n; i++) {
      const [ch, color] = set[Math.floor(Math.random() * set.length)];
      const p = document.createElement('div');
      const ang = (Math.PI * 2 * i) / n + Math.random() * .6;
      const dist = 38 + Math.random() * 42;
      p.className = 'particle' + (ch === 'bub' ? ' bub' : '');
      if (ch !== 'bub') { p.textContent = ch; p.style.color = color; p.style.fontSize = (12 + Math.random() * 10) + 'px'; }
      else p.style.setProperty('--s', (6 + Math.random() * 10) + 'px');
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist - 20 + 'px');   // 稍微往上飄
      p.style.setProperty('--r', (Math.random() * 240 - 120) + 'deg');
      p.style.setProperty('--t', (.6 + Math.random() * .4) + 's');
      p.style.textShadow = '0 1px 2px rgba(0,0,0,.15)';
      pool.appendChild(p);
      particleCount++;
      setTimeout(() => { p.remove(); particleCount--; }, 1000);
    }
  }

  // ===== 成就 =====
  // 大致依照難度排列；名稱與說明在 I18N 的 ach.<id>.name / ach.<id>.desc
  const rareCaught = () => Object.values(state.dex).reduce((a, n) => a + n, 0);
  const ACHIEVEMENTS = [
    { id: 'clicker', icon: '🫧',
      progress: () => [state.stats.clicks, 200], reward: { rainbow: 5, coinSec: 120 } },
    { id: 'pet', icon: '💕',
      progress: () => [state.stats.pets, 50], reward: { rainbow: 5, coinSec: 120 } },
    { id: 'namer', icon: '✏️',
      progress: () => [Object.values(state.looks).filter(l => l && l.name).length, 3], reward: { rainbow: 5, coinSec: 120 } },
    { id: 'ducks', icon: '🐤',
      progress: () => [state.ducks, 5], reward: { rainbow: 10, coinSec: 300 } },
    { id: 'rare10', icon: '✨',
      progress: () => [rareCaught(), 10], reward: { rainbow: 10, coinSec: 300 } },
    { id: 'clicker2', icon: '🌊',
      progress: () => [state.stats.clicks, 2000], reward: { rainbow: 15, coinSec: 600 } },
    { id: 'snack10', icon: '🍡',
      progress: () => [state.snackLv, 10], reward: { rainbow: 10, coinSec: 300 } },
    { id: 'chair5', icon: '💺',
      progress: () => [state.chairLv, 5], reward: { rainbow: 15, coinSec: 300 } },
    { id: 'fashion', icon: '👒',
      progress: () => [state.wardrobe.hats.length + state.wardrobe.towels.length, 10], reward: { rainbow: 20, coinSec: 600 } },
    { id: 'daily7', icon: '📅',
      progress: () => [state.daily.streak, 7], reward: { rainbow: 20, coinSec: 600 } },
    { id: 'poolLv', icon: '🏗️',
      progress: () => [POOLS.reduce((a, p) => a + state.pools[p.id].lv, 0), 30], reward: { rainbow: 15, coinSec: 600 } },
    { id: 'earn1m', icon: '💰',
      progress: () => [state.stats.totalEarned, 1e6], reward: { rainbow: 20, coinSec: 600 } },
    { id: 'tycoon', icon: '👑',
      progress: () => [POOLS.filter(p => state.pools[p.id].unlocked).length, POOLS.length], reward: { rainbow: 50, coinSec: 900 } },
    { id: 'dex', icon: '📖',
      progress: () => {
        const regular = RARE_TYPES.filter(t => !t.season);   // 季節限定不列入，任何時候都能達成
        return [regular.filter(t => state.dex[t.id]).length, regular.length];
      }, reward: { rainbow: 30, coinSec: 600 } },
    { id: 'rare50', icon: '🔮',
      progress: () => [rareCaught(), 50], reward: { rainbow: 30, coinSec: 900 } },
    { id: 'fest1', icon: '🏮',
      progress: () => [state.festivals, 1], reward: { rainbow: 20, coinSec: 600 } },
    { id: 'earn1b', icon: '💎',
      progress: () => [state.stats.totalEarned, 1e9], reward: { rainbow: 50, coinSec: 1200 } },
    { id: 'fest5', icon: '🎆',
      progress: () => [state.festivals, 5], reward: { rainbow: 50, coinSec: 1200 } },
  ];
  localize(ACHIEVEMENTS, { name: a => `ach.${a.id}.name`, desc: a => `ach.${a.id}.desc` });
  // 溫泉幣獎勵以「幾秒份的產出」計算，玩到後期也一樣有感
  const achCoins = a => Math.round(Math.max(1000, perSecond() * a.reward.coinSec));

  function checkAchievements() {
    for (const a of ACHIEVEMENTS) {
      if (state.ach[a.id]) continue;
      const [cur, target] = a.progress();
      if (cur >= target) {
        state.ach[a.id] = 'done';
        sfx.sparkle();
        toast(t('ach.toast', { name: a.name }));
        save();
      }
    }
    renderAch();
  }

  let achSig = '';
  // 已達成的成就一律顯示滿格（溫泉祭後小鴨等數量歸零也不會倒退）
  const achProgress = a => {
    const [cur, target] = a.progress();
    return [state.ach[a.id] ? target : Math.min(cur, target), target];
  };
  function renderAch() {
    // 只有狀態或語言改變時才整個重畫，避免「領取」按鈕在點擊途中被換掉；
    // 進度條則直接更新數字與長度（累計收入每秒都在變）
    const sig = lang + '|' + ACHIEVEMENTS.map(a => state.ach[a.id] || '').join('|');
    if (sig !== achSig) {
      achSig = sig;
      $('ach-list').innerHTML = ACHIEVEMENTS.map(a => {
        const st = state.ach[a.id];
        const right = st === 'done'
          ? `<button class="claim" data-sfx="own" data-ach="${a.id}">${t('ach.claim')}</button>`
          : st === 'claimed' ? `<span class="stamp-ok">${t('ach.claimed')}</span>` : '';
        return `
          <div class="ach ${st || ''}">
            <div class="medal">${a.icon}</div>
            <div class="info">
              <div class="aname">${a.name}</div>
              <div class="adesc">${a.desc}</div>
              <div class="bar"><i></i></div>
              <div class="meta"><span class="aprog"></span>
                <span>${t('ach.reward', { r: a.reward.rainbow, m: a.reward.coinSec / 60 })}</span></div>
            </div>
            ${right}
          </div>`;
      }).join('');
      setPaneSub('ach', t('ach.count', { a: ACHIEVEMENTS.filter(a => state.ach[a.id]).length, b: ACHIEVEMENTS.length }));
    }
    const cards = $('ach-list').children;
    ACHIEVEMENTS.forEach((a, i) => {
      const [cur, target] = achProgress(a);
      cards[i].querySelector('.bar i').style.width = (cur / target * 100) + '%';
      cards[i].querySelector('.aprog').textContent = `${fmt(Math.floor(cur))} / ${fmt(target)}`;
    });
  }

  $('ach-list').addEventListener('click', e => {
    const btn = e.target.closest('.claim');
    if (!btn) return;
    const a = ACHIEVEMENTS.find(x => x.id === btn.dataset.ach);
    if (!a || state.ach[a.id] !== 'done') return;
    const coins = achCoins(a);
    earn(coins);
    state.rainbow += a.reward.rainbow;
    state.ach[a.id] = 'claimed';
    sfx.sparkle();
    toast(t('ach.claimToast', { c: fmt(coins), r: a.reward.rainbow }));
    const s = slimes[Math.floor(Math.random() * slimes.length)];
    if (s) say(s, t('ach.say'));
    renderAch(); render(); save();
  });

  // ===== 下方分頁列 & 滑出面板 =====
  const PANE_TITLE = { shop: 'shop.title', house: 'house.title', dex: 'dex.title', ach: 'ach.title', fest: 'fest.title' };
  const paneSubs = {};          // 各面板標題旁的小字（例如「已發現 3 / 9」）
  let openPaneId = null;
  function setPaneSub(pane, text) {
    paneSubs[pane] = text;
    if (openPaneId === pane) $('sheet-sub').textContent = text;
  }
  function renderSheetHead() {
    if (!openPaneId) return;
    $('sheet-title').textContent = t(PANE_TITLE[openPaneId]);
    $('sheet-sub').textContent = paneSubs[openPaneId] || '';
  }
  function openPane(id) {
    openPaneId = id;
    document.querySelectorAll('.pane').forEach(el => el.classList.toggle('on', el.dataset.pane === id));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('on', el.dataset.pane === id));
    renderSheetHead();
    $('sheet-body').scrollTop = 0;
    $('sheet').classList.add('open');
    $('sheet').setAttribute('aria-hidden', 'false');
  }
  function closeSheet() {
    if (!openPaneId) return;
    openPaneId = null;
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('on'));
    $('sheet').classList.remove('open');
    $('sheet').setAttribute('aria-hidden', 'true');
  }
  $('nav').addEventListener('click', e => {
    const b = e.target.closest('.nav-btn');
    if (!b) return;
    if (openPaneId === b.dataset.pane) closeSheet();   // 再點一次同一個分頁 → 收起來
    else openPane(b.dataset.pane);
  });
  $('sheet-close').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => {
    // Esc 一次只關最上層：設定 / 換裝視窗已經處理過的話（defaultPrevented）就不關面板
    if (e.key === 'Escape' && openPaneId && !e.defaultPrevented && settingsBg.hidden && dressBg.hidden) closeSheet();
  });

  // ===== 購買升級 =====
  $('buy-pool').addEventListener('click', () => {
    const c = cost.pool();
    if (!activeData().unlocked || state.coins < c) return;
    state.coins -= c; activeData().lv++;
    sfx.ding();
    syncSlimes(); render(); save();
  });
  $('buy-duck').addEventListener('click', () => {
    const c = cost.duck();
    if (state.coins < c) return;
    state.coins -= c; state.ducks++;
    sfx.ding();
    syncDucks(); render(); save();
    const s = slimes[Math.floor(Math.random() * slimes.length)];
    if (s) say(s, t('say.duck'));
  });
  $('buy-snack').addEventListener('click', () => {
    const c = cost.snack();
    if (state.coins < c) return;
    state.coins -= c; state.snackLv++;
    sfx.ding();
    render(); save();
    const s = slimes[Math.floor(Math.random() * slimes.length)];
    if (s) say(s, t(state.snackLv === 1 ? 'say.snackOpen' : 'say.snack'));
  });
  // 新升級共用的購買流程：kind = cost 的名稱，field = state 的欄位，cur = 'coins' 或 'rainbow'
  function buyUpgrade(kind, field, cur, line) {
    const c = cost[kind]();
    if (state[field] >= (MAX_LV[kind] || Infinity) || state[cur] < c) return;
    state[cur] -= c; state[field]++;
    sfx.ding();
    render(); save();
    const s = slimes[Math.floor(Math.random() * slimes.length)];
    if (s) say(s, t(line));
  }
  $('buy-helper').addEventListener('click', () => buyUpgrade('helper', 'helperLv', 'coins', 'say.helper'));
  $('buy-milk').addEventListener('click',   () => buyUpgrade('milk', 'milkLv', 'coins', 'say.milk'));
  $('buy-lure').addEventListener('click',   () => buyUpgrade('lure', 'lureLv', 'coins', 'say.lure'));
  $('buy-bamboo').addEventListener('click', () => buyUpgrade('bamboo', 'bambooLv', 'rainbow', 'say.bamboo'));

  $('buy-chair').addEventListener('click', () => {
    const c = cost.chair();
    if (state.rainbow < c) return;
    state.rainbow -= c; state.chairLv++;
    sfx.ding();
    render(); save();
    const s = slimes[Math.floor(Math.random() * slimes.length)];
    if (s) say(s, t('say.chair'));
  });

  // ===== 設定視窗 =====
  const settingsBg = $('settings-bg');
  function openSettings() {
    syncVolUI();
    $('about-ver').textContent = t('about.ver', {
      v: 'v' + VERSION, d: new Date(state.startedAt).toLocaleDateString(DATE_LOCALE[lang]) });
    settingsBg.hidden = false;
  }
  function closeSettings() {
    settingsBg.hidden = true;
    disarmReset();
    $('save-panel').hidden = true;
  }
  $('gear-btn').addEventListener('click', openSettings);
  $('settings-close').addEventListener('click', closeSettings);
  settingsBg.addEventListener('click', e => { if (e.target === settingsBg) closeSettings(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !settingsBg.hidden) { closeSettings(); e.preventDefault(); }   // 標記已處理，後面的面板不要跟著關
  });

  // ----- 音量滑桿 -----
  const VOL_SLIDERS = {
    music: { get: () => musicVol, set: v => { musicVol = v; bgm.volume = bgmVolume(); }, key: MUSIC_VOL_KEY, last: 50 },
    sfx:   { get: () => sfxVol,   set: v => { sfxVol = v; sfxOn = v > 0; },             key: SFX_VOL_KEY,   last: 80 },
  };
  function syncVolUI() {
    for (const [id, c] of Object.entries(VOL_SLIDERS)) {
      const v = c.get();
      $(id + '-vol').value = v;
      $(id + '-vol').style.setProperty('--p', v + '%');   // Chrome / Safari 的已填滿部分
      $(id + '-vol-val').textContent = v + '%';
      $(id + '-vol-ico').textContent = v === 0 ? '🔇' : (id === 'music' ? '🎵' : '🔔');
    }
  }
  function setVol(id, v, preview) {
    const c = VOL_SLIDERS[id];
    c.set(v);
    try { localStorage.setItem(c.key, String(v)); } catch (e) {}
    syncVolUI();
    if (preview && id === 'sfx') sfx.ding();    // 放開滑桿時給一聲示範
  }
  for (const id of Object.keys(VOL_SLIDERS)) {
    const input = $(id + '-vol');
    input.addEventListener('input', () => setVol(id, Number(input.value)));
    input.addEventListener('change', () => setVol(id, Number(input.value), true));
    // 點喇叭圖示：靜音 ↔ 恢復成靜音前的音量
    $(id + '-vol-ico').addEventListener('click', () => {
      const c = VOL_SLIDERS[id], v = c.get();
      if (v > 0) { c.last = v; setVol(id, 0); }
      else setVol(id, c.last || 50, true);
    });
  }

  // ----- 語言 -----
  $('lang-btns').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (b && b.dataset.lang !== lang) setLang(b.dataset.lang);
  });

  // ----- 重看新手教學 -----
  $('tutorial-btn').addEventListener('click', () => { closeSettings(); startTutorial(); });

  // 重置：按兩次才會真的清除，避免誤觸
  let resetTimer = null;
  function disarmReset() {
    clearTimeout(resetTimer);
    $('reset').classList.remove('armed');
    $('reset').textContent = t('set.resetBtn');
  }
  $('reset').addEventListener('click', function () {
    if (!this.classList.contains('armed')) {
      this.classList.add('armed');
      this.textContent = t('set.resetConfirm');
      resetTimer = setTimeout(disarmReset, 3000);
      return;
    }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = freshState();
    if (rare) removeRare(rare);
    refreshAll();
    closeSettings();
    toast(t('reset.done'));
    startTutorial();          // 從頭開始經營，順便再看一次教學
  });

  // 整個 state 被換掉後（重置 / 匯入），重畫所有畫面
  function refreshAll() {
    if (rare) removeRare(rare);
    switchPool(state.activePool);
    syncDucks(); renderDex(); renderAch(); render(); updateGiftDot(); save();
  }

  // ===== 存檔碼匯出 / 匯入 =====
  // 格式：SLIME1- + Base64(UTF-8 JSON)。前綴用來辨認是不是本遊戲的存檔碼。
  const SAVE_PREFIX = 'SLIME1-';
  const toB64 = str => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
  const fromB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

  let saveMode = null;   // 'export' | 'import'
  let importArmed = false;
  function setSaveMsg(text, err) {
    $('save-msg').textContent = text;
    $('save-msg').classList.toggle('err', !!err);
  }

  $('export-btn').addEventListener('click', () => {
    save();
    saveMode = 'export';
    $('save-panel').hidden = false;
    $('save-code').readOnly = true;
    $('save-code').value = SAVE_PREFIX + toB64(JSON.stringify(state));
    $('save-action').textContent = t('set.copy');
    setSaveMsg(t('save.exportMsg'));
    $('save-code').select();
  });

  $('import-btn').addEventListener('click', () => {
    saveMode = 'import';
    importArmed = false;
    $('save-panel').hidden = false;
    $('save-code').readOnly = false;
    $('save-code').value = '';
    $('save-action').textContent = t('set.import');
    setSaveMsg(t('save.importMsg'));
    $('save-code').focus();
  });

  $('save-action').addEventListener('click', async () => {
    const ta = $('save-code');
    if (saveMode === 'export') {
      try {
        await navigator.clipboard.writeText(ta.value);
      } catch (e) {                   // 部分瀏覽器以 file:// 開啟時不允許剪貼簿 API
        ta.select();
        document.execCommand('copy');
      }
      setSaveMsg(t('save.copied'));
      return;
    }

    // 匯入：先驗證，再按一次確認
    const code = ta.value.trim();
    let data;
    try {
      if (!code.startsWith(SAVE_PREFIX)) throw new Error('prefix');
      data = JSON.parse(fromB64(code.slice(SAVE_PREFIX.length)));
      if (typeof data.coins !== 'number' || typeof data.pools !== 'object') throw new Error('shape');
    } catch (e) {
      importArmed = false;
      $('save-action').textContent = t('set.import');
      setSaveMsg(t('save.invalid'), true);
      return;
    }
    if (!importArmed) {
      importArmed = true;
      $('save-action').textContent = t('save.confirmBtn');
      setSaveMsg(t('save.preview', { c: fmt(data.coins), r: fmt(data.rainbow || 0) }));
      return;
    }
    state = normalize(data);
    state.lastSeen = Date.now();      // 匯入不重複發放離線收益
    refreshAll();
    closeSettings();
    sfx.sparkle();
    toast(t('save.done'));
  });
  $('save-code').addEventListener('input', () => {
    if (saveMode === 'import' && importArmed) { importArmed = false; $('save-action').textContent = t('set.import'); }
  });

  // ===== 每日登入獎勵 =====
  const DAILY_COIN_MULT = [1, 1.5, 2, 2.5, 3, 4, 6];      // 第 1~7 天的溫泉幣倍率
  const DAILY_RAINBOW   = [2, 3, 4, 5, 6, 8, 20];         // 第 1~7 天的彩虹金幣
  const dateStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const todayStr = () => dateStr(new Date());
  function daysBetween(a, b) {
    const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
    return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
  }
  const canClaimDaily = () => state.daily.last !== todayStr();
  // 昨天有領 → 連續天數 +1；中斷超過一天 → 從第 1 天重新開始
  const nextStreak = () =>
    state.daily.last && daysBetween(state.daily.last, todayStr()) === 1 ? state.daily.streak + 1 : 1;
  const cycleDay = streak => ((streak - 1) % 7) + 1;      // 7 天一輪
  const dailyReward = day => ({
    coins: Math.round(Math.max(500, perSecond() * 600) * DAILY_COIN_MULT[day - 1]),  // 約 10 分鐘產出起跳
    rainbow: DAILY_RAINBOW[day - 1],
  });

  function updateGiftDot() { $('gift-dot').hidden = !canClaimDaily(); }

  let dailyBg = null;
  function showDaily() {
    if (dailyBg) return;
    const claimable = canClaimDaily();
    const streak = claimable ? nextStreak() : state.daily.streak;
    const day = cycleDay(streak);
    const r = dailyReward(day);
    const stamps = DAILY_COIN_MULT.map((_, i) => {
      const n = i + 1;
      const cls = n < day || (n === day && !claimable) ? 'done' : (n === day ? 'today' : '');
      return `<div class="stamp ${cls}"><i>${n === 7 ? '🎁' : (n % 2 ? '💰' : '🌈')}</i>${t('daily.day', { n })}</div>`;
    }).join('');

    dailyBg = document.createElement('div');
    dailyBg.className = 'modal-bg';
    dailyBg.innerHTML = `
      <div class="modal daily">
        <div class="big">🎁</div>
        <h3>${t(claimable ? 'daily.title' : 'daily.claimed')}</h3>
        <p>${t('daily.streak', { n: streak })}${t(claimable ? 'daily.gift' : 'daily.tomorrow')}</p>
        <div class="stamps">${stamps}</div>
        ${claimable ? `
          <div class="reward-line">${t('reward.coins', { n: fmt(r.coins) })}</div>
          <div class="reward-line rb">${t('reward.rainbow', { n: fmt(r.rainbow) })}</div>
          <button data-sfx="own" id="claim-btn">${t('daily.claim')}</button>
          <button class="link-btn" id="daily-later">${t('daily.later')}</button>`
        : `<button id="daily-later">${t('daily.ok')}</button>`}
        <p style="font-size:.75rem;opacity:.6;margin-top:10px">${t('daily.note')}</p>
      </div>`;
    document.body.appendChild(dailyBg);
    const close = () => { dailyBg.remove(); dailyBg = null; };
    dailyBg.querySelector('#daily-later').onclick = close;
    const claim = dailyBg.querySelector('#claim-btn');
    if (claim) claim.onclick = () => {
      if (!canClaimDaily()) return close();
      earn(r.coins);
      state.rainbow += r.rainbow;
      state.daily = { last: todayStr(), streak };
      sfx.sparkle();
      toast(t('daily.toast', { n: day }));
      const s = slimes[Math.floor(Math.random() * slimes.length)];
      if (s) say(s, t('daily.say'));
      close(); updateGiftDot(); render(); save();
    };
  }
  $('gift-btn').addEventListener('click', showDaily);
  const maybeShowDaily = () => { if (canClaimDaily()) showDaily(); };
  setInterval(updateGiftDot, 30000);   // 玩到跨日時，禮物按鈕會亮起紅點

  // ===== 蒸氣 =====
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('div');
    s.className = 'steam';
    s.style.left = (8 + i * 13) + '%';
    s.style.animationDelay = (i * 0.8) + 's';
    s.style.animationDuration = (4 + Math.random() * 3) + 's';
    pool.appendChild(s);
  }

  // ===== 史萊姆 =====
  // 史萊姆的閒聊台詞在 I18N 的 'lines'、摸摸台詞在 'petLines'
  const slimes = [];

  function slimeCount() { return Math.min(active().colors.length, 2 + Math.floor(activeData().lv / 3)); }

  // ===== 史萊姆外觀：名字 / 帽子 / 毛巾 =====
  const HATS = [
    { id: 'none',       icon: '✖️', cost: 0 },
    { id: 'ribbon',     icon: '🎀', cost: 8 },
    { id: 'flower',     icon: '🌼', cost: 8 },
    { id: 'cap',        icon: '🧢', cost: 15 },
    { id: 'strawberry', icon: '🍓', cost: 15 },
    { id: 'strawhat',   icon: '👒', cost: 25 },
    { id: 'grad',       icon: '🎓', cost: 30 },
    { id: 'crown',      icon: '👑', cost: 60 },
  ];
  localize(HATS, { name: h => 'hat.' + h.id });
  const TOWELS = [
    { id: 'default',  color: null,      cost: 0 },   // 使用溫泉池預設的毛巾顏色
    { id: 'none',     color: null,      cost: 0 },
    { id: 'pink',     color: '#ffc4d4', cost: 5 },
    { id: 'mint',     color: '#bff0d8', cost: 5 },
    { id: 'sky',      color: '#bfe3ff', cost: 5 },
    { id: 'lavender', color: '#e0d0ff', cost: 5 },
    { id: 'lemon',    color: '#fff1a8', cost: 5 },
    { id: 'stripe',   color: 'repeating-linear-gradient(90deg,#fff 0 4px,#7fb3c9 4px 8px)', cost: 12 },
  ];
  localize(TOWELS, { name: tw => 'towel.' + tw.id });
  const lookKey = (poolId, i) => `${poolId}-${i}`;
  const defaultName = (poolId, i) => t('names.' + poolId)[i];   // 預設名字跟著語言切換
  function getLook(poolId, i) {
    const raw = state.looks[lookKey(poolId, i)] || {};
    return {
      hat: 'none',
      towel: i % 2 === 0 ? 'default' : 'none',
      ...raw,
      name: raw.name || defaultName(poolId, i),
    };
  }
  const escapeHTML = str => String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 帽子可以是 emoji，或特別的 'santa'（用 CSS 畫的聖誕帽）
  const hatHTML = hat => hat === 'santa' ? '<span class="santa-hat"></span>' : hat;
  function towelColor(look, poolId) {
    if (look.towel === 'none') return null;
    if (look.towel === 'default') return poolDef(poolId).towel;
    return (TOWELS.find(tw => tw.id === look.towel) || TOWELS[0]).color || poolDef(poolId).towel;
  }
  function hatIcon(look) {
    const h = HATS.find(x => x.id === look.hat);
    return h && h.id !== 'none' ? h.icon : '';
  }
  // 小史萊姆圖示（史萊姆之家、換裝預覽用）
  function miniSlimeHTML(color, look, poolId) {
    const tc = towelColor(look, poolId), hi = hatIcon(look);
    return `<div class="mini-slime" style="--c:${color}">
      ${tc ? `<i class="mtowel" style="--towel:${tc}"></i>` : ''}
      ${hi ? `<span class="mhat">${hi}</span>` : ''}</div>`;
  }

  // opts: { color, hat, rare, index }
  function createSlime(opts) {
    const el = document.createElement('div');
    el.className = 'slime' + (opts.rare ? ' rare' : '');
    el.style.setProperty('--c', opts.color);
    const sparkles = opts.rare
      ? `<span class="sparkle" style="left:-10px;top:4px">✦</span>
         <span class="sparkle" style="right:-10px;top:14px;animation-delay:.5s">✧</span>`
      : '';
    el.innerHTML = `
      <div class="body"></div>
      ${opts.rare ? `<div class="hat">${hatHTML(opts.hat)}</div>` : '<div class="deco"></div>'}${sparkles}
      <div class="eye l"></div><div class="eye r"></div>
      <div class="blush l"></div><div class="blush r"></div>
      <div class="mouth"></div>
      <div class="water-line"></div>
      ${opts.rare ? '' : '<div class="tag"></div>'}
      <div class="bubble"></div>`;
    pool.appendChild(el);
    const s = { el, bubble: el.querySelector('.bubble'), timer: null, index: opts.index, poolId: state.activePool };
    if (!opts.rare) applyLook(s);
    moveSlime(s, true);
    if (!opts.rare) el.addEventListener('click', () => petSlime(s));  // 點擊事件會繼續傳到溫泉池，照樣撈到金幣
    return s;
  }

  // 依照存檔的外觀，更新池中史萊姆的毛巾、帽子、名牌
  function applyLook(s) {
    const look = getLook(s.poolId, s.index);
    const tc = towelColor(look, s.poolId), hi = hatIcon(look);
    s.el.querySelector('.deco').innerHTML =
      (tc ? `<div class="towel" style="--towel:${tc}"></div>` : '') +
      (hi ? `<div class="hat">${hi}</div>` : '');
    s.el.querySelector('.tag').textContent = look.name;
  }

  // 摸摸一般史萊姆：Q彈 + 對話 + 愛心
  function petSlime(s) {
    s.el.classList.remove('squish');
    void s.el.offsetWidth;  // 重新觸發動畫
    s.el.classList.add('squish');
    sfx.boing();
    state.stats.pets++;
    const name = getLook(s.poolId, s.index).name;
    const lines = t('petLines').concat([t('say.iam', { name }), t('say.love', { name })]);
    say(s, lines[Math.floor(Math.random() * lines.length)]);
    spawnHearts(s.el, 5);
  }

  function slimePos(el) {
    const r = el.getBoundingClientRect(), p = pool.getBoundingClientRect();
    return { x: r.left - p.left + r.width / 2, y: r.top - p.top };
  }

  function spawnHearts(el, n) {
    const { x, y } = slimePos(el);
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = Math.random() < .7 ? '♥' : '♡';
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
      h.style.animationDelay = (i * 0.08) + 's';
      h.style.fontSize = (14 + Math.random() * 10) + 'px';
      pool.appendChild(h);
      setTimeout(() => h.remove(), 1600);
    }
  }

  function moveSlime(s, instant) {
    const w = pool.clientWidth, h = pool.clientHeight;
    const x = 20 + Math.random() * Math.max(0, w - 104);
    const y = 60 + Math.random() * Math.max(0, h - 140);
    if (instant) s.el.style.transition = 'none';
    s.el.style.left = x + 'px';
    s.el.style.top = y + 'px';
    s.el.style.zIndex = Math.round(y);
    if (instant) { s.el.offsetHeight; s.el.style.transition = ''; }
  }

  function say(s, text) {
    const lines = t('lines').concat(active().lines);
    s.bubble.textContent = text || lines[Math.floor(Math.random() * lines.length)];
    s.bubble.classList.add('show');
    clearTimeout(s.timer);
    s.timer = setTimeout(() => s.bubble.classList.remove('show'), 2600);
  }

  function syncSlimes(quiet) {
    while (slimes.length < slimeCount()) {
      const s = createSlime({ color: active().colors[slimes.length], index: slimes.length });
      slimes.push(s);
      if (!quiet && slimes.length > 2) say(s, t('say.join', { name: getLook(s.poolId, s.index).name }));
    }
    while (slimes.length > slimeCount()) slimes.pop().el.remove();
    renderHouse();
  }

  // ===== 史萊姆之家 & 換裝 =====
  function renderHouse() {
    const def = active();
    setPaneSub('house', t('house.guests', { icon: def.icon, pool: def.name }));
    $('house').innerHTML = slimes.map(s => {
      const look = getLook(s.poolId, s.index);
      return `<button class="house-card" data-i="${s.index}">
        ${miniSlimeHTML(def.colors[s.index], look, s.poolId)}
        <div class="hname">${escapeHTML(look.name)}</div>
        <div class="hedit">${t('house.edit')}</div>
      </button>`;
    }).join('');
  }
  $('house').addEventListener('click', e => {
    const card = e.target.closest('.house-card');
    if (card) openDress(Number(card.dataset.i));
  });

  const dressBg = $('dress-bg');
  let dressing = null;   // 目前正在換裝的史萊姆

  function setLook(patch) {
    const key = lookKey(dressing.poolId, dressing.index);
    const raw = { ...state.looks[key], ...patch };
    if (!raw.name) delete raw.name;          // 沒有自己取名 → 不存，顯示目前語言的預設名字
    state.looks[key] = raw;
    applyLook(dressing);
    renderDress();
    renderHouse();
    save();
  }

  function renderDress() {
    const s = dressing, look = getLook(s.poolId, s.index);
    $('dress-preview').outerHTML = miniSlimeHTML(poolDef(s.poolId).colors[s.index], look, s.poolId)
      .replace('class="mini-slime"', 'class="mini-slime" id="dress-preview"');
    $('dress-rainbow').textContent = fmt(state.rainbow);
    const item = (kind, it, equipped, owned, swatch) => `
      <button class="ward-item ${equipped ? 'equipped' : ''} ${owned ? '' : 'locked'}" data-kind="${kind}" data-id="${it.id}" data-sfx="own">
        ${swatch}
        <small>${owned ? it.name : '🌈' + it.cost}</small>
      </button>`;
    $('wardrobe-hats').innerHTML = HATS.map(h => item('hat', h, look.hat === h.id,
      h.cost === 0 || state.wardrobe.hats.includes(h.id), `<span class="wi">${h.icon}</span>`)).join('');
    $('wardrobe-towels').innerHTML = TOWELS.map(tw => {
      const c = tw.id === 'default' ? poolDef(s.poolId).towel : tw.color;
      const sw = c ? `<span class="swatch" style="background:${c}"></span>` : '<span class="wi">✖️</span>';
      return item('towel', tw, look.towel === tw.id, tw.cost === 0 || state.wardrobe.towels.includes(tw.id), sw);
    }).join('');
  }

  function openDress(i) {
    dressing = slimes.find(s => s.index === i);
    if (!dressing) return;
    $('dress-name').value = getLook(dressing.poolId, i).name;
    $('dress-msg').textContent = '';
    renderDress();
    dressBg.hidden = false;
  }
  function closeDress() {
    if (!dressing) return;
    const name = $('dress-name').value.trim();
    setLook({ name: name && name !== defaultName(dressing.poolId, dressing.index) ? name : '' });
    say(dressing, t('dress.happy', { name: getLook(dressing.poolId, dressing.index).name }));
    spawnHearts(dressing.el, 5);
    dressing = null;
    dressBg.hidden = true;
  }
  $('dress-close').addEventListener('click', closeDress);
  dressBg.addEventListener('click', e => { if (e.target === dressBg) closeDress(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !dressBg.hidden) { closeDress(); e.preventDefault(); }
  });
  $('dress-name').addEventListener('keydown', e => { if (e.key === 'Enter') closeDress(); });

  // 點衣櫃：已擁有 → 穿上；未擁有 → 用彩虹金幣購買並穿上
  $('wardrobe-hats').parentElement.addEventListener('click', e => {
    const btn = e.target.closest('.ward-item');
    if (!btn || !dressing) return;
    const kind = btn.dataset.kind, id = btn.dataset.id;
    const list = kind === 'hat' ? HATS : TOWELS;
    const owned = kind === 'hat' ? state.wardrobe.hats : state.wardrobe.towels;
    const it = list.find(x => x.id === id);
    if (it.cost > 0 && !owned.includes(id)) {
      if (state.rainbow < it.cost) {
        sfx.tick();
        $('dress-msg').textContent = t('dress.short', { n: fmt(it.cost - state.rainbow) });
        return;
      }
      state.rainbow -= it.cost;
      owned.push(id);
      sfx.ding();
      $('dress-msg').textContent = t('dress.bought', { name: it.name });
    } else {
      sfx.pop();
      $('dress-msg').textContent = '';
    }
    setLook(kind === 'hat' ? { hat: id } : { towel: id });
    render();
  });

  // ===== 多重溫泉池：分頁、切換、解鎖 =====
  $('pool-tabs').innerHTML = POOLS.map(p => `
    <button class="round-btn pool-btn" id="tab-${p.id}" data-pool="${p.id}">
      ${p.icon}<span class="plv" id="tabinfo-${p.id}"></span>
    </button>`).join('');
  // 按鈕上只有圖示，名稱放在滑鼠提示 / 讀屏文字，以及溫泉池上方的名牌
  const renderTabNames = () => {
    POOLS.forEach(p => {
      $('tab-' + p.id).title = p.name;
      $('tab-' + p.id).setAttribute('aria-label', p.name);
    });
    $('pool-title').textContent = active().name;
  };
  $('pool-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.pool-btn');
    if (tab && tab.dataset.pool !== state.activePool) switchPool(tab.dataset.pool);
  });

  function switchPool(id) {
    state.activePool = id;
    const def = active();
    pool.dataset.theme = id;
    buildFx(id);
    while (slimes.length) slimes.pop().el.remove();   // 換成這座池子的史萊姆
    syncSlimes(true);
    POOLS.forEach(p => $('tab-' + p.id).classList.toggle('active', p.id === id));
    $('pool-title').textContent = def.name;

    const locked = !activeData().unlocked;
    $('lock-overlay').hidden = !locked;
    if (locked) renderLock();
    else if (slimes[0]) say(slimes[0], def.lines[0]);
    render();
  }
  // 未解鎖溫泉池的說明（切換語言時也會呼叫）
  function renderLock() {
    const def = active();
    $('lock-icon').textContent = def.icon;
    $('lock-name').textContent = def.name;
    $('lock-desc').textContent =
      t('unlock.desc', { ps: fmt(def.base * multiplier()), pc: fmt(def.clickBase) });
  }

  $('unlock-btn').addEventListener('click', () => {
    const def = active(), data = activeData();
    if (data.unlocked || state.coins < def.unlock) return;
    state.coins -= def.unlock;
    data.unlocked = true;
    sfx.sparkle();
    switchPool(def.id);
    toast(t('unlock.toast', { pool: def.name }));
    if (slimes[1]) say(slimes[1], t('unlock.say'));
    save();
  });

  // 各溫泉池的背景特效
  function buildFx(id) {
    const fx = $('fx');
    fx.innerHTML = '';
    const add = (cls, style, text = '') => {
      const el = document.createElement('div');
      el.className = cls;
      Object.assign(el.style, style);
      el.textContent = text;
      fx.appendChild(el);
    };
    const rand = (a, b) => a + Math.random() * (b - a);

    if (id === 'forest') {
      for (let i = 0; i < 5; i++) {   // 飄落的小葉子
        add('petal', { left: rand(0, 95) + '%', background: '#9ad9a8',
          animationDuration: rand(9, 14) + 's', animationDelay: -rand(0, 14) + 's' });
      }
    } else if (id === 'sakura') {
      add('sakura-branch', {}, '🌸');
      for (let i = 0; i < 18; i++) {  // 櫻花飄落
        add('petal', { left: rand(-5, 95) + '%',
          animationDuration: rand(6, 11) + 's', animationDelay: -rand(0, 11) + 's',
          transform: `scale(${rand(.7, 1.2)})` });
      }
    } else if (id === 'aurora') {
      add('aurora-band', {});
      add('aurora-band b2', {});
      for (let i = 0; i < 22; i++) {  // 星星
        add('star', { left: rand(0, 100) + '%', top: rand(0, 45) + '%',
          animationDelay: -rand(0, 2) + 's', opacity: rand(.4, 1) });
      }
      for (let i = 0; i < 12; i++) {  // 雪花
        add('snow', { left: rand(0, 95) + '%', fontSize: rand(9, 15) + 'px',
          animationDuration: rand(8, 14) + 's', animationDelay: -rand(0, 14) + 's' }, '❄');
      }
      add('ice', { left: '-6px' }, '🧊');
      add('ice', { right: '-4px', fontSize: '28px' }, '🧊');
    }
  }

  // ===== 季節活動（依照玩家電腦 / 手機的日期自動切換）=====
  const SEASON_INFO = {
    spring: { fx: { chars: ['🌸', '✿'], n: 6, color: '#ffb7c9' } },
    summer: { fx: 'firefly' },
    autumn: { fx: { chars: ['🍁', '🍂'], n: 7 } },
    winter: { fx: { chars: ['❄', '❅'], n: 10, color: '#ffffff' } },
    xmas:   {},
  };
  for (const [k, v] of Object.entries(SEASON_INFO)) v.id = k;
  localize(Object.values(SEASON_INFO), { label: v => `season.${v.id}.label`, when: v => `season.${v.id}.when` });
  // 回傳目前有效的季節標籤，例如 ['autumn'] 或 ['winter', 'xmas']
  // 測試用：網址加上 ?season=spring / summer / autumn / winter / xmas 可以強制切換
  function detectSeasons() {
    const now = new Date();
    let m = now.getMonth() + 1, d = now.getDate();
    const force = new URLSearchParams(location.search).get('season');
    const FORCE = { spring: [4, 1], summer: [7, 1], autumn: [10, 1], winter: [1, 15], xmas: [12, 20] };
    if (FORCE[force]) [m, d] = FORCE[force];
    const base = m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
    return m === 12 && d <= 25 ? [base, 'xmas'] : [base];
  }
  const SEASONS = detectSeasons();

  const renderSeasonBadge = () => {
    $('season-badge').textContent = SEASON_INFO[SEASONS.includes('xmas') ? 'xmas' : SEASONS[0]].label;
  };
  function setupSeason() {
    renderSeasonBadge();
    $('season-badge').hidden = false;

    // 季節飄落物，所有溫泉池都看得到
    const layer = document.createElement('div');
    layer.className = 'season-fx';
    const fx = SEASON_INFO[SEASONS[0]].fx;
    const rand = (a, b) => a + Math.random() * (b - a);
    if (fx === 'firefly') {
      for (let i = 0; i < 8; i++) {
        const f = document.createElement('div');
        f.className = 'firefly';
        Object.assign(f.style, { left: rand(5, 90) + '%', top: rand(20, 80) + '%',
          animationDelay: -rand(0, 4) + 's', animationDuration: rand(3, 5) + 's' });
        layer.appendChild(f);
      }
    } else {
      for (let i = 0; i < fx.n; i++) {
        const p = document.createElement('div');
        p.className = 'sp';
        p.textContent = fx.chars[i % fx.chars.length];
        Object.assign(p.style, { left: rand(0, 95) + '%', fontSize: rand(12, 20) + 'px',
          color: fx.color || '', animationDuration: rand(8, 13) + 's', animationDelay: -rand(0, 13) + 's' });
        layer.appendChild(p);
      }
    }
    pool.appendChild(layer);
  }

  // ===== 稀有史萊姆 =====
  const RARE_TYPES = [
    { id: 'gold',    hat: '🎩', color: '#ffd54a', weight: 55, stars: '★',
      reward: () => ({ coins: Math.max(50, perSecond() * 60) }) },
    { id: 'rainbow', hat: '🌈', weight: 25, stars: '★★',
      color: 'linear-gradient(135deg,#ffb3ba,#ffdfba,#ffffba,#baffc9,#bae1ff,#d7baff)',
      reward: () => ({ rainbow: Math.max(3, rainbowPerSecond() * 120) }) },
    { id: 'sakura',  hat: '🌸', color: '#ffd1dc', weight: 15, stars: '★★★',
      reward: () => ({ coins: Math.max(100, perSecond() * 120), rainbow: 2 }) },
    { id: 'king',    hat: '👑', color: '#b9a3f0', weight: 5, stars: '★★★★',
      reward: () => ({ coins: Math.max(500, perSecond() * 300), rainbow: 10 }) },

    // ----- 季節限定（只在對應季節出現，不影響常駐圖鑑成就）-----
    { id: 'dango', season: 'spring', hat: '🍡', weight: 30,
      color: 'linear-gradient(180deg,#ffc9d9 0 34%,#fff6e0 34% 67%,#c9ecb4 67%)',
      reward: () => ({ coins: Math.max(300, perSecond() * 180), rainbow: 5 }) },
    { id: 'watermelon', season: 'summer', hat: '🍉', weight: 30,
      color: 'linear-gradient(180deg,#ff8f9c 0 74%,#8fd18f 74%)',
      reward: () => ({ coins: Math.max(300, perSecond() * 180), rainbow: 5 }) },
    { id: 'maple', season: 'autumn', hat: '🍁', weight: 30,
      color: '#ffb36b',
      reward: () => ({ coins: Math.max(300, perSecond() * 180), rainbow: 5 }) },
    { id: 'snowman', season: 'winter', hat: '⛄', weight: 30,
      color: '#f4fbff',
      reward: () => ({ coins: Math.max(300, perSecond() * 180), rainbow: 5 }) },
    { id: 'santa', season: 'xmas', hat: 'santa', weight: 25,
      color: '#ffb3b8',
      reward: () => ({ coins: Math.max(500, perSecond() * 300), rainbow: 12 }) },
  ];
  localize(RARE_TYPES, { name: r => `rare.${r.id}.name`, hello: r => `rare.${r.id}.hello` });
  // 稀有度：常駐的用星星（不用翻譯），季節限定的顯示「春季限定」等文字
  RARE_TYPES.forEach(r => Object.defineProperty(r, 'rarity', {
    get: () => r.season ? t('rarity.' + r.season) : r.stars, enumerable: true }));
  const isAvailable = t => !t.season || SEASONS.includes(t.season);
  // 停留時間 12 秒、每秒出現機率 1/45（平均約 45 秒一隻）；招客大燈籠每級：停留 +2 秒、機率 +25%
  const rareStayMs = () => 12000 + state.lureLv * 2000;
  const rareChance = () => (1 / 45) * (1 + state.lureLv * 0.25);
  let rare = null;

  function pickRareType() {
    const candidates = RARE_TYPES.filter(isAvailable);
    const total = candidates.reduce((a, t) => a + t.weight, 0);
    let r = Math.random() * total;
    return candidates.find(t => (r -= t.weight) < 0) || candidates[0];
  }

  let toastTimer = null;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  function spawnRare() {
    const type = pickRareType();
    const s = createSlime({ color: type.color, hat: type.hat, rare: true });
    s.type = type;
    s.el.addEventListener('click', e => { e.stopPropagation(); catchRare(s); });
    s.leaveTimer = setTimeout(() => { say(s, t('rare.bye')); removeRare(s); }, rareStayMs());
    rare = s;
    say(s, type.hello);
    toast(t('rare.appear', { name: type.name }));
  }

  function catchRare(s) {
    if (s.caught) return;
    s.caught = true;
    clearTimeout(s.leaveTimer);
    sfx.sparkle();
    const r = s.type.reward();
    if (r.coins) earn(r.coins);
    if (r.rainbow) state.rainbow += r.rainbow;
    const isNew = !state.dex[s.type.id];
    state.dex[s.type.id] = (state.dex[s.type.id] || 0) + 1;

    const { x, y } = slimePos(s.el);
    const parts = [];
    if (r.coins) parts.push('💰+' + fmt(r.coins));
    if (r.rainbow) parts.push('🌈+' + fmt(r.rainbow));
    floatText(x, y, parts.join(' '));
    spawnHearts(s.el, 8);
    say(s, t('rare.thanks'));
    toast(isNew ? t('rare.new', { name: s.type.name }) : t('rare.again', { name: s.type.name, n: state.dex[s.type.id] }));
    removeRare(s);
    renderDex(); render(); save();
  }

  function removeRare(s) {
    clearTimeout(s.leaveTimer);
    if (rare === s) rare = null;
    setTimeout(() => s.el.classList.add('leaving'), 700);
    setTimeout(() => s.el.remove(), 1600);
  }

  function renderDex() {
    $('dex').innerHTML = RARE_TYPES.map(r => {   // 變數不能叫 t，會蓋掉翻譯函式 t()
      const n = state.dex[r.id] || 0;
      const avail = isAvailable(r);
      const status = n ? t('dex.seen', { n })
        : r.season ? (avail ? t('dex.active') : t('dex.when', { when: SEASON_INFO[r.season].when }))
        : t('dex.unknown');
      return `
        <div class="dex-card ${n ? '' : 'locked'} ${r.season && !avail ? 'off-season' : ''}">
          ${r.season ? `<span class="limited">${t('dex.limited')}</span>` : ''}
          <div class="pic" style="--c:${r.color}"><span>${hatHTML(r.hat)}</span></div>
          <div class="dname">${n ? r.name : '？？？'}</div>
          <div class="rarity">${r.rarity}</div>
          <div class="count">${status}</div>
        </div>`;
    }).join('');
    setPaneSub('dex', t('dex.count', { a: RARE_TYPES.filter(r => state.dex[r.id]).length, b: RARE_TYPES.length }));
  }

  // ===== 小鴨 =====
  const ducks = [];
  function syncDucks() {
    const show = Math.min(state.ducks, 10);
    while (ducks.length < show) {
      const d = document.createElement('div');
      d.className = 'duck';
      d.textContent = '🐤';
      d.style.left = (Math.random() * (pool.clientWidth - 40)) + 'px';
      d.style.top = (40 + Math.random() * (pool.clientHeight - 100)) + 'px';
      d.style.animationDelay = (Math.random() * 2) + 's';
      pool.appendChild(d);
      ducks.push(d);
    }
    while (ducks.length > show) ducks.pop().remove();
  }
  function driftDucks() {
    ducks.forEach(d => {
      d.style.left = (Math.random() * (pool.clientWidth - 40)) + 'px';
    });
  }

  // ===== 離線收益 =====
  // 回傳是否有顯示離線收益視窗；onClose 會在玩家按下「收下！」後執行
  function grantOffline(onClose) {
    const away = Math.min((Date.now() - state.lastSeen) / 1000, offlineCapSec());   // 基本 8 小時，竹筒可以加長
    if (away < 10) return false;
    const gain = perSecond() * away;
    const rainbowGain = rainbowPerSecond() * away;
    earn(gain);
    state.rainbow += rainbowGain;
    // 發完就把計時歸零，同一段時間才不會被發兩次（例如教學結束時分頁剛好在背景）
    state.lastSeen = Date.now();
    if (hiddenSince) hiddenSince = state.lastSeen;
    save();
    showOfflineModal(away, gain, rainbowGain, onClose);
    return true;
  }

  function showOfflineModal(sec, gain, rainbowGain, onClose) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div class="big">🌙♨️</div>
        <h3>${t('off.title')}</h3>
        <p>${t('off.away', { t: fmtTime(sec) })}${sec >= offlineCapSec() ? t('off.cap', { h: offlineCapSec() / 3600 }) : ''}</p>
        <p>${t('off.earned')}</p>
        <div class="gain">${t('reward.coins', { n: fmt(gain) })}</div>
        ${rainbowGain > 0 ? `<div class="gain" style="color:#b77ad6;font-size:1.2rem">${t('reward.rainbow', { n: fmt(rainbowGain) })}</div>` : ''}
        <button>${t('off.ok')}</button>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelector('button').onclick = () => { bg.remove(); if (onClose) onClose(); };
  }

  // ===== 多語言：套用到畫面 =====
  // HTML 上的 data-i18n（文字）、data-i18n-html（含 <b> 等標籤）、data-i18n-attr（"屬性1,屬性2:key"）
  function applyStaticText() {
    document.documentElement.lang = HTML_LANG[lang];
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      const [attrs, key] = el.dataset.i18nAttr.split(':');
      attrs.split(',').forEach(a => el.setAttribute(a, t(key)));
    });
    $('lang-btns').innerHTML = LANGS.map(([id, label]) =>
      `<button class="mini-btn ${id === lang ? 'on' : ''}" data-lang="${id}">${label}</button>`).join('');
  }

  function setLang(l) {
    if (!I18N[l]) return;
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    applyStaticText();
    // 設定視窗裡依狀態變化的文字
    disarmReset();
    $('save-panel').hidden = true;
    if (!settingsBg.hidden) openSettings();
    // 遊戲畫面
    renderTabNames();
    renderSheetHead();
    renderSeasonBadge();
    lanternShown = -1;                     // 讓溫泉祭區塊重寫
    if (!activeData().unlocked) renderLock();
    slimes.forEach(s => applyLook(s));     // 名牌（預設名字會換成新語言）
    renderHouse(); renderDex(); renderAch(); render();
    if (dressing) renderDress();
    updateMusicBtn();
    if (tut) showTutStep();
  }

  // ===== 新手教學 =====
  // 依序把畫面上的區塊打亮並說明；教學中擋住遊戲畫面，避免誤點。
  const TUT_STEPS = [
    { key: 'welcome', target: null, langs: true },
    { key: 'pool',  target: () => $('pool') },
    { key: 'stats', target: () => document.querySelector('.hud') },
    { key: 'tabs',  target: () => $('pool-tabs') },
    { key: 'nav',   target: () => $('nav') },
    { key: 'shop',  target: () => document.querySelector('.nav-btn[data-pane="shop"]') },
    { key: 'top',   target: () => document.querySelector('.top-btns') },
  ];
  let tut = null;   // 進行中的教學：{ step, layer, spot, card, raf, onDone }

  function startTutorial(onDone) {
    if (tut) return;
    const layer = document.createElement('div');
    layer.className = 'tut-layer';
    layer.innerHTML = '<div class="tut-spot none"></div><div class="tut-card"></div>';
    document.body.appendChild(layer);
    tut = { step: 0, layer, spot: layer.querySelector('.tut-spot'), card: layer.querySelector('.tut-card'), raf: 0, onDone };
    layer.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || !tut) return;
      if (b.dataset.lang) { if (b.dataset.lang !== lang) setLang(b.dataset.lang); return; }
      if (b.classList.contains('tut-skip')) return endTutorial();
      if (b.classList.contains('tut-next')) {
        if (tut.step < TUT_STEPS.length - 1) { tut.step++; showTutStep(); }
        else endTutorial();
      }
    });
    closeSheet();
    showTutStep();
    tutLoop();
    window.addEventListener('scroll', placeTut, { passive: true });
    window.addEventListener('resize', placeTut);
  }

  function showTutStep() {
    const st = TUT_STEPS[tut.step], last = tut.step === TUT_STEPS.length - 1;
    tut.card.innerHTML = `
      ${st.target ? '' : '<div class="tut-slime">♨️</div>'}
      <h3>${t('tut.' + st.key + 'Title')}</h3>
      <p>${t('tut.' + st.key)}</p>
      ${st.langs ? `<div class="tut-langs">${LANGS.map(([id, label]) =>
        `<button data-lang="${id}" class="${id === lang ? 'on' : ''}">${label}</button>`).join('')}</div>` : ''}
      <div class="tut-foot">
        <button class="tut-skip" ${last ? 'style="visibility:hidden"' : ''}>${t('tut.skip')}</button>
        <span class="tut-step">${tut.step + 1} / ${TUT_STEPS.length}</span>
        <button class="tut-next">${t(last ? 'tut.start' : 'tut.next')}</button>
      </div>`;
    placeTut();
  }

  // 每一格畫面都重新對齊；另外在捲動、旋轉手機、視窗縮放時也會立刻對齊
  function tutLoop() {
    if (!tut) return;
    placeTut();
    tut.raf = requestAnimationFrame(tutLoop);
  }
  function placeTut() {
    if (!tut) return;
    const st = TUT_STEPS[tut.step], el = st.target && st.target();
    const { spot, card } = tut;
    const vw = window.innerWidth, vh = window.innerHeight, pad = 8, gap = 12;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let left, top;
    tut.layer.classList.toggle('dim', !el);
    if (!el) {
      spot.classList.add('none');
      left = (vw - cw) / 2;
      top = (vh - ch) / 2;
    } else {
      spot.classList.remove('none');
      const r = el.getBoundingClientRect();
      Object.assign(spot.style, {
        left: r.left - pad + 'px', top: r.top - pad + 'px',
        width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px',
      });
      // 說明卡放在目標下方；放不下就放上方；都放不下（目標太高）就貼在畫面底部
      if (r.bottom + pad + gap + ch <= vh - 8) top = r.bottom + pad + gap;
      else if (r.top - pad - gap - ch >= 8) top = r.top - pad - gap - ch;
      else top = vh - ch - 12;
      left = r.left + r.width / 2 - cw / 2;
    }
    left = Math.min(Math.max(16, left), vw - cw - 16);
    Object.assign(card.style, { left: left + 'px', top: Math.max(8, top) + 'px' });
  }

  function endTutorial() {
    if (!tut) return;
    cancelAnimationFrame(tut.raf);
    window.removeEventListener('scroll', placeTut);
    window.removeEventListener('resize', placeTut);
    tut.layer.remove();
    const done = tut.onDone;
    tut = null;
    state.tutorial = true;
    save();
    if (done) done();
  }

  // ===== 初始化 =====
  const saved = load();
  if (saved) state = saved;
  applyStaticText();
  renderTabNames();
  setupSeason();
  switchPool(state.activePool);
  syncDucks();
  renderDex();
  render();
  // 新玩家：先看教學，看完再跳每日獎勵；老玩家：先顯示離線收益，收下後再跳出每日獎勵
  const showWelcomeModals = () => { if (!(saved && grantOffline(maybeShowDaily))) maybeShowDaily(); };
  if (!state.tutorial) startTutorial(showWelcomeModals);
  else showWelcomeModals();
  updateGiftDot();
  checkAchievements();
  save();

  // ===== 主迴圈 =====
  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 1);  // 分頁切走時交由離線機制處理
    last = now;
    earn(perSecond() * dt);
    state.rainbow += rainbowPerSecond() * dt;
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  setInterval(() => slimes.forEach(s => Math.random() < .5 && moveSlime(s)), 3500);
  setInterval(() => {
    const s = slimes[Math.floor(Math.random() * slimes.length)];
    if (s) say(s);
  }, 3000);
  setInterval(driftDucks, 6000);
  setInterval(save, 5000);
  setInterval(checkAchievements, 1000);   // 購買、捕獲、解鎖後一秒內就會跳出成就
  setInterval(() => {
    if (!rare && !tut && !document.hidden && activeData().unlocked && Math.random() < rareChance()) spawnRare();
  }, 1000);

  // 分頁切走後回來：補發這段時間的收益
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenSince = Date.now(); save(); return; }
    hiddenSince = null;
    // 隔天切回來也能領每日獎勵；教學進行中先不跳（教學結束時會自己跳出來）
    if (!tut && !grantOffline(maybeShowDaily)) maybeShowDaily();
    updateGiftDot();
    last = performance.now();
    save();
  });
  window.addEventListener('beforeunload', save);

  // ===== 背景音樂 =====
  // 瀏覽器不允許網頁一打開就自動播放聲音，必須等玩家互動（點擊 / 按鍵）後才能 play()。
  // 做法：先試著播放一次；若被擋下，就在玩家第一次點擊畫面時再播放。
  const MUSIC_KEY = 'slimeOnsenMusic';
  const bgm = $('bgm');
  const musicBtn = $('music-btn');
  let musicOn = true;       // 玩家的偏好（預設開啟，會記住）
  let musicMissing = false;
  try { musicOn = localStorage.getItem(MUSIC_KEY) !== 'off'; } catch (e) {}
  bgm.volume = bgmVolume();   // 注意：iPhone / iPad 的 Safari 不允許網頁調整音量，只能開關

  function updateMusicBtn() {
    const playing = !bgm.paused;
    musicBtn.classList.toggle('playing', playing);
    musicBtn.classList.toggle('off', !musicOn);
    musicBtn.classList.toggle('waiting', musicMissing || (musicOn && !playing));
    musicBtn.title = t(musicMissing ? 'music.missing' : (playing ? 'music.pause' : 'music.play'));
    musicBtn.querySelector('.label').textContent = t(musicMissing ? 'music.missing' : 'music.tapToStart');
  }
  function setMusicPref(on) {
    musicOn = on;
    try { localStorage.setItem(MUSIC_KEY, on ? 'on' : 'off'); } catch (e) {}
  }
  function tryPlay() {
    return bgm.play().catch(() => {}).finally(updateMusicBtn);
  }

  musicBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (musicMissing) return;
    if (bgm.paused) { setMusicPref(true); tryPlay(); }
    else { setMusicPref(false); bgm.pause(); }
    updateMusicBtn();
  });

  // 玩家第一次與頁面互動時開始播放（按音樂鈕本身由上面的處理負責）
  function onFirstGesture(e) {
    if (e.target.closest && e.target.closest('#music-btn')) return;
    if (musicOn && bgm.paused && !musicMissing) tryPlay();
    document.removeEventListener('click', onFirstGesture, true);
    document.removeEventListener('keydown', onFirstGesture, true);
  }
  document.addEventListener('click', onFirstGesture, true);
  document.addEventListener('keydown', onFirstGesture, true);

  bgm.addEventListener('play', updateMusicBtn);
  bgm.addEventListener('pause', updateMusicBtn);
  bgm.addEventListener('error', () => {
    musicMissing = true;
    updateMusicBtn();
  });

  updateMusicBtn();
  if (musicOn) tryPlay();   // 有些瀏覽器（或曾互動過的網站）會直接允許

  // ===== PWA：註冊 Service Worker（離線遊玩）=====
  // 只有透過 https（例如 GitHub Pages）或 localhost 開啟時才有效；直接雙擊 html 檔時會略過。
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
